<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>CYBER NYZA CHAT</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b12;
  color:white;
  min-height:100vh;
}


/* LOGIN SCREEN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
  radial-gradient(circle at top right,#293c8f55,transparent 40%),
  linear-gradient(135deg,#080b12,#151d35);
}

.loginBox{
  width:100%;
  max-width:400px;

  padding:35px 25px;

  background:#111827;

  border:1px solid #2a3555;

  border-radius:25px;

  box-shadow:
  0 20px 60px #00000080;
}

.loginLogo{
  text-align:center;

  font-size:32px;

  font-weight:bold;

  margin-bottom:10px;

  color:#ffffff;
}

.loginSub{
  text-align:center;

  color:#9ca3af;

  margin-bottom:30px;
}

.loginBox input{

  width:100%;

  padding:16px;

  border-radius:14px;

  border:1px solid #334155;

  background:#0b1020;

  color:white;

  font-size:16px;

  outline:none;

  margin-bottom:15px;
}

.loginBox button{

  width:100%;

  padding:16px;

  border:none;

  border-radius:14px;

  background:linear-gradient(135deg,#2563eb,#6d28d9);

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;
}


/* CHAT SCREEN */

#chatScreen{
  display:none;

  min-height:100vh;

  flex-direction:column;

  background:
  radial-gradient(circle at top left,#1e3a8a33,transparent 40%),
  #080b12;
}


.header{

  position:sticky;

  top:0;

  z-index:10;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:15px;

  background:#111827eF;

  border-bottom:1px solid #26324b;

  backdrop-filter:blur(10px);
}


.userInfo{

  min-width:0;
}


.userEmail{

  font-size:15px;

  font-weight:bold;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.status{

  font-size:12px;

  color:#22c55e;

  margin-top:4px;
}


.logoutBtn{

  border:none;

  padding:10px 15px;

  border-radius:12px;

  background:#ef4444;

  color:white;

  font-weight:bold;

  cursor:pointer;
}


/* MESSAGES */

#messages{

  flex:1;

  padding:20px 14px 130px;

  display:flex;

  flex-direction:column;

  gap:14px;

  overflow-y:auto;
}


.message{

  max-width:80%;

  padding:13px 15px;

  border-radius:20px;

  word-wrap:break-word;

  background:#1e293b;

  align-self:flex-start;

  box-shadow:0 5px 20px #00000025;
}


.message.mine{

  align-self:flex-end;

  background:linear-gradient(
    135deg,
    #2563eb,
    #4338ca
  );
}


.sender{

  font-size:12px;

  font-weight:bold;

  opacity:.8;

  margin-bottom:6px;
}


.messageText{

  font-size:16px;

  line-height:1.4;
}


.time{

  font-size:10px;

  opacity:.65;

  margin-top:7px;
}


.message img{

  max-width:100%;

  border-radius:12px;

  margin-top:5px;

  display:block;
}


.message audio{

  width:100%;

  margin-top:5px;
}


.fileLink{

  display:block;

  color:white;

  text-decoration:none;

  padding:10px;

  border-radius:10px;

  background:#00000030;
}


/* RECORDING STATUS */

#recordingStatus{

  display:none;

  position:fixed;

  bottom:85px;

  left:50%;

  transform:translateX(-50%);

  background:#ef4444;

  padding:8px 15px;

  border-radius:20px;

  font-size:13px;

  z-index:20;
}


/* INPUT AREA */

.inputArea{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  padding:12px;

  display:flex;

  gap:8px;

  align-items:center;

  background:#111827;

  border-top:1px solid #26324b;
}


#messageInput{

  flex:1;

  border:none;

  outline:none;

  padding:15px;

  border-radius:25px;

  background:#1f2937;

  color:white;

  font-size:16px;

  min-width:0;
}


.iconBtn{

  width:48px;

  height:48px;

  border:none;

  border-radius:50%;

  background:#26324b;

  color:white;

  font-size:20px;

  cursor:pointer;

  flex-shrink:0;
}


#sendBtn{

  padding:14px 18px;

  border:none;

  border-radius:25px;

  background:linear-gradient(
    135deg,
    #2563eb,
    #4338ca
  );

  color:white;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  flex-shrink:0;
}


#fileInput{
  display:none;
}


@media(max-width:500px){

  .message{
    max-width:88%;
  }

  #sendBtn{
    padding:14px;
  }

}

</style>

</head>

<body>


<!-- LOGIN SCREEN -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="loginLogo">
      ⚡ CYBER NYZA
    </div>

    <div class="loginSub">
      Real-time Chat
    </div>

    <input
      id="nameInput"
      type="text"
      placeholder="Enter your name"
      maxlength="30"
    >

    <button onclick="login()">
      Enter Chat
    </button>

  </div>

</div>



<!-- CHAT SCREEN -->

<div id="chatScreen">

  <div class="header">

    <div class="userInfo">

      <div class="userEmail"
      id="userName">
      </div>

      <div class="status">
        🟢 Connected
      </div>

    </div>

    <button
      class="logoutBtn"
      onclick="logout()">

      Logout

    </button>

  </div>



  <!-- MESSAGES -->

  <div id="messages"></div>



  <!-- RECORDING STATUS -->

  <div id="recordingStatus">

    🔴 Recording voice message...

  </div>



  <!-- MESSAGE INPUT -->

  <div class="inputArea">

    <button
      class="iconBtn"
      onclick="openFile()">

      📎

    </button>


    <input
      type="file"
      id="fileInput"
      accept="image/*,video/*,audio/*"
    >


    <input
      id="messageInput"
      placeholder="Type a message..."
    >


    <button
      class="iconBtn"
      id="voiceBtn"
      onclick="toggleRecording()">

      🎤

    </button>


    <button
      id="sendBtn"
      onclick="sendMessage()">

      Send

    </button>

  </div>


</div>



<script type="module">


/* =========================
   FIREBASE IMPORTS
========================= */


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

  getFirestore,

  collection,

  addDoc,

  onSnapshot,

  query,

  orderBy

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {

  getStorage,

  ref,

  uploadBytes,

  getDownloadURL

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */


const firebaseConfig = {

  apiKey:
  "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",

  authDomain:
  "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",

  projectId:
  "cyber-nyza-by-mrjingan-9d4c3",

  storageBucket:
  "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",

  messagingSenderId:
  "246846891948",

  appId:
  "1:246846891948:web:7054c940ea7b9eefce3c09"

};


/* =========================
   INITIALIZE FIREBASE
========================= */


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const storage =
getStorage(app);


/* =========================
   ELEMENTS
========================= */


const loginScreen =
document.getElementById("loginScreen");


const chatScreen =
document.getElementById("chatScreen");


const nameInput =
document.getElementById("nameInput");


const userName =
document.getElementById("userName");


const messagesDiv =
document.getElementById("messages");


const messageInput =
document.getElementById("messageInput");


const fileInput =
document.getElementById("fileInput");


const voiceBtn =
document.getElementById("voiceBtn");


const recordingStatus =
document.getElementById("recordingStatus");


/* =========================
   CURRENT USER
========================= */


let currentUser =
localStorage.getItem("cyberNyzaUser");


/* =========================
   LOGIN
========================= */


window.login = function(){

  const name =
  nameInput.value.trim();


  if(!name){

    alert(
      "Please enter your name"
    );

    return;

  }


  currentUser =
  name;


  localStorage.setItem(
    "cyberNyzaUser",
    currentUser
  );


  startChat();

};


/* =========================
   START CHAT
========================= */


function startChat(){

  loginScreen.style.display =
  "none";


  chatScreen.style.display =
  "flex";


  userName.textContent =
  "👤 " + currentUser;


  loadMessages();

}


/* =========================
   LOGOUT
========================= */


window.logout = function(){

  localStorage.removeItem(
    "cyberNyzaUser"
  );


  currentUser = null;


  chatScreen.style.display =
  "none";


  loginScreen.style.display =
  "flex";


  messagesDiv.innerHTML =
  "";

};


/* =========================
   SEND TEXT MESSAGE
========================= */


window.sendMessage =
async function(){

  const text =
  messageInput.value.trim();


  if(!text)
  return;


  messageInput.value =
  "";


  try{

    await addDoc(

      collection(
        db,
        "messages"
      ),

      {

        sender:
        currentUser,

        type:
        "text",

        text:
        text,

        clientTime:
        Date.now()

      }

    );


  }
  catch(error){

    console.error(error);

    alert(
      "Message failed to send"
    );

  }

};


/* =========================
   ENTER KEY SEND
========================= */


messageInput.addEventListener(
  "keydown",

  function(event){

    if(event.key === "Enter"){

      sendMessage();

    }

  }

);


/* =========================
   LOAD REALTIME MESSAGES
========================= */


let messagesStarted =
false;


function loadMessages(){

  if(messagesStarted)
  return;


  messagesStarted =
  true;


  const q =
  query(

    collection(
      db,
      "messages"
    ),

    orderBy(
      "clientTime",
      "asc"
    )

  );


  onSnapshot(

    q,

    function(snapshot){

      messagesDiv.innerHTML =
      "";


      snapshot.forEach(

        function(doc){

          renderMessage(
            doc.data()
          );

        }

      );


      scrollToBottom();

    },

    function(error){

      console.error(error);

      messagesDiv.innerHTML =

      `
      <div style="
      text-align:center;
      color:#f87171;
      padding:20px">

      Firebase error:
      Check Firestore Rules.

      </div>
      `;

    }

  );

}


/* =========================
   RENDER MESSAGE
========================= */


function renderMessage(data){

  const message =
  document.createElement("div");


  message.className =
  "message";


  if(
    data.sender === currentUser
  ){

    message.classList.add(
      "mine"
    );

  }


  const sender =
  document.createElement("div");

  sender.className =
  "sender";

  sender.textContent =
  data.sender || "User";


  message.appendChild(
    sender
  );


  /* TEXT MESSAGE */

  if(
    data.type === "text"
  ){

    const text =
    document.createElement("div");

    text.className =
    "messageText";

    text.textContent =
    data.text;

    message.appendChild(
      text
    );

  }


  /* IMAGE MESSAGE */

  else if(
    data.type === "image"
  ){

    const image =
    document.createElement("img");

    image.src =
    data.url;

    image.loading =
    "lazy";

    message.appendChild(
      image
    );

  }


  /* AUDIO MESSAGE */

  else if(
    data.type === "audio"
  ){

    const audio =
    document.createElement("audio");

    audio.controls =
    true;

    audio.src =
    data.url;

    message.appendChild(
      audio
    );

  }


  /* VIDEO MESSAGE */

  else if(
    data.type === "video"
  ){

    const video =
    document.createElement("video");

    video.controls =
    true;

    video.src =
    data.url;

    video.style.width =
    "100%";

    video.style.borderRadius =
    "12px";

    message.appendChild(
      video
    );

  }


  /* FILE MESSAGE */

  else{

    const link =
    document.createElement("a");

    link.href =
    data.url;

    link.target =
    "_blank";

    link.className =
    "fileLink";

    link.textContent =
    "📄 " +
    (
      data.fileName ||
      "Download File"
    );


    message.appendChild(
      link
    );

  }


  /* TIME */

  const time =
  document.createElement("div");

  time.className =
  "time";


  if(data.clientTime){

    const date =
    new Date(
      data.clientTime
    );


    time.textContent =
    date.toLocaleString();

  }


  message.appendChild(
    time
  );


  messagesDiv.appendChild(
    message
  );

}


/* =========================
   SCROLL
========================= */


function scrollToBottom(){

  setTimeout(

    function(){

      messagesDiv.scrollTop =
      messagesDiv.scrollHeight;

    },

    100

  );

}


/* =========================
   OPEN FILE
========================= */


window.openFile =
function(){

  fileInput.click();

};


/* =========================
   FILE UPLOAD
========================= */


fileInput.addEventListener(

  "change",

  async function(){

    const file =
    fileInput.files[0];


    if(!file)
    return;


    try{


      const fileName =

      Date.now() +

      "_" +

      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


      const storageRef =
      ref(

        storage,

        "uploads/" +
        fileName

      );


      alert(
        "Uploading media..."
      );


      await uploadBytes(

        storageRef,

        file

      );


      const url =
      await getDownloadURL(
        storageRef
      );


      let type =
      "file";


      if(
        file.type.startsWith(
          "image/"
        )
      ){

        type =
        "image";

      }


      else if(
        file.type.startsWith(
          "video/"
        )
      ){

        type =
        "video";

      }


      else if(
        file.type.startsWith(
          "audio/"
        )
      ){

        type =
        "audio";

      }


      await addDoc(

        collection(
          db,
          "messages"
        ),

        {

          sender:
          currentUser,

          type:
          type,

          url:
          url,

          fileName:
          file.name,

          clientTime:
          Date.now()

        }

      );


      fileInput.value =
      "";


    }
    catch(error){

      console.error(error);

      alert(
        "Upload failed. Check Firebase Storage Rules."
      );

    }


  }

);


/* =========================
   VOICE RECORDING
========================= */


let mediaRecorder =
null;


let audioChunks =
[];


let recording =
false;


window.toggleRecording =
async function(){


  /* START RECORDING */

  if(!recording){


    try{


      const stream =
      await navigator.mediaDevices.getUserMedia({

        audio:true

      });


      audioChunks =
      [];


      mediaRecorder =
      new MediaRecorder(
        stream
      );


      mediaRecorder.ondataavailable =
      function(event){

        audioChunks.push(
          event.data
        );

      };


      mediaRecorder.onstop =
      async function(){


        stream
        .getTracks()
        .forEach(

          track =>
          track.stop()

        );


        const audioBlob =
        new Blob(

          audioChunks,

          {

            type:
            "audio/webm"

          }

        );


        await uploadVoice(
          audioBlob
        );


      };


      mediaRecorder.start();


      recording =
      true;


      voiceBtn.textContent =
      "⏹";


      recordingStatus.style.display =
      "block";


    }
    catch(error){

      console.error(error);


      alert(

        "Microphone permission is required for voice messages."

      );

    }


  }


  /* STOP RECORDING */

  else{


    if(

      mediaRecorder &&

      mediaRecorder.state ===
      "recording"

    ){

      mediaRecorder.stop();

    }


    recording =
    false;


    voiceBtn.textContent =
    "🎤";


    recordingStatus.style.display =
    "none";


  }


};


/* =========================
   UPLOAD VOICE
========================= */


async function uploadVoice(
  blob
){


  try{


    const fileName =

    "voice_" +

    Date.now() +

    ".webm";


    const storageRef =
    ref(

      storage,

      "voices/" +
      fileName

    );


    await uploadBytes(

      storageRef,

      blob

    );


    const url =
    await getDownloadURL(
      storageRef
    );


    await addDoc(

      collection(
        db,
        "messages"
      ),

      {

        sender:
        currentUser,

        type:
        "audio",

        url:
        url,

        fileName:
        fileName,

        clientTime:
        Date.now()

      }

    );


  }
  catch(error){

    console.error(error);


    alert(
      "Voice upload failed."
    );

  }


}


/* =========================
   AUTO LOGIN
========================= */


if(currentUser){

  startChat();

}


console.log(
  "CYBER NYZA CHAT READY"
);


</script>


</body>
</html>
