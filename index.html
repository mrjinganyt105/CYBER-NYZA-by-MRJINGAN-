<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBER NYZA by MRJINGAN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #050505;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* LOGIN SCREEN */

#loginPage {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
    radial-gradient(circle at top, #062b1b, #050505 60%);
}

.login-box {
    width: 90%;
    max-width: 400px;
    padding: 35px 25px;
    border: 1px solid #00ff88;
    border-radius: 20px;
    background: rgba(10,10,10,0.95);
    box-shadow: 0 0 30px rgba(0,255,136,0.25);
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    color: #00ff88;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #00ff88;
}

.by {
    color: #aaa;
    margin-top: 8px;
    margin-bottom: 30px;
    font-size: 12px;
}

.login-box input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    color: white;
    outline: none;
}

.login-box input:focus {
    border-color: #00ff88;
}

.login-btn {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #00ff88;
    color: black;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* CHAT APP */

#chatPage {
    display: none;
    height: 100vh;
    flex-direction: column;
}

.header {
    height: 70px;
    background: #0b0b0b;
    border-bottom: 1px solid #1d1d1d;
    display: flex;
    align-items: center;
    padding: 0 18px;
    justify-content: space-between;
}

.header-left {
    display: flex;
    align-items: center;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #00ff88;
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    margin-right: 12px;
}

.user-name {
    font-size: 16px;
    font-weight: bold;
}

.status {
    font-size: 11px;
    color: #00ff88;
    margin-top: 3px;
}

.cyber-title {
    color: #00ff88;
    font-size: 12px;
}

/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background:
    radial-gradient(circle at bottom, #062317, #050505 65%);
}

.message {
    max-width: 75%;
    padding: 12px 15px;
    border-radius: 15px;
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
}

.received {
    background: #171717;
    border: 1px solid #242424;
    border-bottom-left-radius: 3px;
}

.sent {
    background: #00b85f;
    color: black;
    margin-left: auto;
    border-bottom-right-radius: 3px;
    font-weight: 500;
}

.time {
    font-size: 9px;
    opacity: 0.7;
    margin-top: 5px;
    text-align: right;
}

/* INPUT */

.chat-input {
    display: flex;
    padding: 12px;
    background: #0b0b0b;
    border-top: 1px solid #222;
    gap: 10px;
}

.chat-input input {
    flex: 1;
    border: none;
    outline: none;
    background: #151515;
    color: white;
    padding: 14px;
    border-radius: 25px;
}

.send-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: #00ff88;
    color: black;
    font-size: 20px;
    cursor: pointer;
}

/* MOBILE */

@media (min-width: 700px) {
    body {
        background: #111;
    }

    #chatPage,
    #loginPage {
        max-width: 500px;
        margin: auto;
        border-left: 1px solid #222;
        border-right: 1px solid #222;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo">CYBER NYZA</div>

        <div class="by">
            REALTIME CHAT<br>
            by MRJINGAN
        </div>

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
        >

        <input
            type="password"
            placeholder="Enter password"
        >

        <button class="login-btn" onclick="login()">
            ENTER CHAT
        </button>

    </div>

</div>


<!-- CHAT PAGE -->

<div id="chatPage">

    <div class="header">

        <div class="header-left">

            <div class="avatar" id="avatar">
                C
            </div>

            <div>

                <div class="user-name">
                    CYBER NYZA USER
                </div>

                <div class="status">
                    ● Online
                </div>

            </div>

        </div>

        <div class="cyber-title">
            CYBER NYZA
        </div>

    </div>


    <div class="messages" id="messages">

        <div class="message received">
            Welcome to CYBER NYZA 🔥
            <div class="time">Now</div>
        </div>

        <div class="message received">
            Secure Dark Cyber Chat 💬
            <div class="time">Now</div>
        </div>

    </div>


    <div class="chat-input">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            onkeypress="handleKey(event)"
        >

        <button
            class="send-btn"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

let currentUser = "User";

function login() {

    const username =
        document.getElementById("username").value.trim();

    if (username === "") {
        alert("Please enter your username!");
        return;
    }

    currentUser = username;

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("chatPage").style.display = "flex";

    document.querySelector(".user-name").innerText =
        currentUser;

    document.getElementById("avatar").innerText =
        currentUser.charAt(0).toUpperCase();
}


function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (text === "") return;

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message sent";

    const now =
        new Date();

    const time =
        now.toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit'
        });

    message.innerHTML =
        text +
        '<div class="time">' +
        time +
        '</div>';

    messages.appendChild(message);

    input.value = "";

    messages.scrollTop =
        messages.scrollHeight;
}


function handleKey(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}

</script>

</body>
</html>
