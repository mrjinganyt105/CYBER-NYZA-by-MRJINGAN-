<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CYBER NYZA CHAT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b12;
      color: white;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    /* LOGIN SCREEN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top left, #3f51b5, transparent 40%),
        #080b12;
    }

    .loginBox {
      width: 100%;
      max-width: 400px;
      background: #111827;
      border: 1px solid #263142;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
    }

    .loginBox h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .loginBox p {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .loginBox input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #202b3c;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;
    }

    .loginBox button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #5367dd;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    /* CHAT APP */

    #app {
      display: none;
      height: 100vh;
      max-width: 1000px;
      margin: auto;
      background: #111827;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: linear-gradient(135deg, #3f51b5, #243b8f);
    }

    .brand {
      font-weight: 800;
      font-size: 20px;
    }

    .userTop {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #263142;
    }

    #logoutBtn {
      border: 0;
      background: rgba(0,0,0,.2);
      color: white;
      padding: 9px 12px;
      border-radius: 10px;
    }

    .layout {
      display: flex;
      height: calc(100vh - 70px);
    }

    /* SIDEBAR */

    .sidebar {
      width: 280px;
      border-right: 1px solid #263142;
      overflow-y: auto;
      background: #0d1420;
    }

    .profileBox {
      padding: 18px;
      border-bottom: 1px solid #263142;
      text-align: center;
    }

    .profileBox label {
      display: block;
      cursor: pointer;
    }

    .profileAvatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      object-fit: cover;
      background: #263142;
      margin-bottom: 8px;
    }

    #photoInput {
      display: none;
    }

    .uploadText {
      color: #93c5fd;
      font-size: 12px;
    }

    #myName {
      font-weight: bold;
      margin-top: 5px;
    }

    .sidebarTitle {
      padding: 14px 16px 8px;
      color: #94a3b8;
      font-size: 13px;
    }

    .room {
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid #1d2735;
    }

    .room:hover,
    .room.active {
      background: #202b3c;
    }

    .userItem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
    }

    .userItem:hover {
      background: #1b2534;
    }

    .smallAvatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #263142;
    }

    .userInfo {
      flex: 1;
      min-width: 0;
    }

    .userName {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .online {
      color: #4ade80;
      font-size: 11px;
      margin-top: 3px;
    }

    .offline {
      color: #64748b;
      font-size: 11px;
      margin-top: 3px;
    }

    /* CHAT */

    .chatArea {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #111827;
    }

    .chatHeader {
      padding: 15px 18px;
      border-bottom: 1px solid #263142;
      font-weight: bold;
    }

    #status {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 75%;
      background: #202b3c;
      padding: 11px 14px;
      border-radius: 16px;
      align-self: flex-start;
      word-break: break-word;
    }

    .msg.mine {
      align-self: flex-end;
      background: #4f63d8;
    }

    .sender {
      font-size: 11px;
      font-weight: bold;
      color: #a5b4fc;
      margin-bottom: 4px;
    }

    .time {
      display: block;
      font-size: 10px;
      color: #cbd5e1;
      opacity: .8;
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      color: #64748b;
      margin-top: 50px;
    }

    .messageBar {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #263142;
    }

    .messageBar input {
      flex: 1;
      border: 0;
      border-radius: 24px;
      padding: 14px;
      background: #202b3c;
      color: white;
      outline: none;
      font-size: 16px;
    }

    .messageBar button {
      border: 0;
      border-radius: 24px;
      padding: 0 22px;
      background: #4f63d8;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .sidebar {
        width: 110px;
      }

      .profileBox {
        padding: 12px 5px;
      }

      #myName {
        font-size: 11px;
        overflow: hidden;
      }

      .sidebarTitle {
        font-size: 10px;
        padding: 10px;
      }

      .userName,
      .online,
      .offline {
        display: none;
      }

      .userItem {
        justify-content: center;
      }

      .room {
        font-size: 12px;
        text-align: center;
      }

      .brand {
        font-size: 16px;
      }

      #logoutBtn {
        padding: 7px;
      }

      .msg {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section id="loginScreen">

    <div class="loginBox">

      <h1>CYBER NYZA CHAT</h1>

      <p>Enter your username to join the chat.</p>

      <input
        id="usernameInput"
        type="text"
        placeholder="Enter username"
        maxlength="20"
      >

      <button id="loginBtn">
        Enter Chat
      </button>

    </div>

  </section>


  <!-- APP -->

  <main id="app">

    <header class="topbar">

      <div class="brand">
        CYBER NYZA CHAT
      </div>

      <div class="userTop">

        <img
          id="topAvatar"
          class="avatar"
          src="https://ui-avatars.com/api/?name=User"
        >

        <button id="logoutBtn">
          Logout
        </button>

      </div>

    </header>


    <div class="layout">


      <!-- SIDEBAR -->

      <aside class="sidebar">

        <div class="profileBox">

          <label for="photoInput">

            <img
              id="profileAvatar"
              class="profileAvatar"
              src="https://ui-avatars.com/api/?name=User"
            >

            <div class="uploadText">
              Change Photo
            </div>

          </label>

          <input
            type="file"
            id="photoInput"
            accept="image/*"
          >

          <div id="myName">
            User
          </div>

        </div>


        <div class="sidebarTitle">
          CHAT ROOM
        </div>

        <div
          class="room active"
          id="globalRoom"
        >
          🌍 Global Chat
        </div>


        <div class="sidebarTitle">
          ONLINE USERS
        </div>

        <div id="usersList"></div>

      </aside>


      <!-- CHAT -->

      <section class="chatArea">

        <div class="chatHeader">

          <div id="chatTitle">
            🌍 Global Chat
          </div>

          <div id="status">
            Connecting...
          </div>

        </div>


        <div id="messages">
          <div class="empty">
            Loading messages...
          </div>
        </div>


        <form
          class="messageBar"
          id="form"
        >

          <input
            id="message"
            placeholder="Type a message..."
            autocomplete="off"
          >

          <button
            id="send"
            type="submit"
          >
            Send
          </button>

        </form>

      </section>

    </div>

  </main>



<script type="module">

/* FIREBASE IMPORTS */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

  getAuth,
  signInAnonymously,
  signOut,
  onAuthStateChanged

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  updateDoc

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {

  getStorage,
  ref,
  uploadBytes,
  getDownloadURL

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",

  authDomain:
  "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",

  projectId:
  "cyber-nyza-by-mrjingan-9d4c3",

  storageBucket:
  "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",

  messagingSenderId:
  "246846891948",

  appId:
  "1:246846891948:web:7054c940ea7b9eefce3c09"

};



/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);



/* ELEMENTS */

const loginScreen =
document.getElementById("loginScreen");

const appScreen =
document.getElementById("app");

const usernameInput =
document.getElementById("usernameInput");

const loginBtn =
document.getElementById("loginBtn");

const myName =
document.getElementById("myName");

const profileAvatar =
document.getElementById("profileAvatar");

const topAvatar =
document.getElementById("topAvatar");

const photoInput =
document.getElementById("photoInput");

const usersList =
document.getElementById("usersList");

const messages =
document.getElementById("messages");

const form =
document.getElementById("form");

const input =
document.getElementById("message");

const send =
document.getElementById("send");

const status =
document.getElementById("status");

const chatTitle =
document.getElementById("chatTitle");

const globalRoom =
document.getElementById("globalRoom");

const logoutBtn =
document.getElementById("logoutBtn");



/* VARIABLES */

let currentUser = null;

let currentProfile = null;

let activeChat = "global";

let unsubscribeMessages = null;



/* LOGIN */

loginBtn.addEventListener(
  "click",
  async () => {

    const username =
    usernameInput.value.trim();

    if (username.length < 2) {

      alert(
        "Please enter a username with at least 2 characters."
      );

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
    "Joining...";


    try {

      await signInAnonymously(auth);


      localStorage.setItem(
        "cyberNyzaUsername",
        username
      );


    }

    catch (error) {

      console.error(error);

      alert(
        "Login error: " + error.code
      );

    }

    finally {

      loginBtn.disabled = false;

      loginBtn.textContent =
      "Enter Chat";

    }

  }
);



/* AUTH STATE */

onAuthStateChanged(
  auth,

  async (user) => {

    if (!user) {

      currentUser = null;

      loginScreen.style.display =
      "flex";

      appScreen.style.display =
      "none";

      return;

    }


    currentUser = user;


    let username =
    localStorage.getItem(
      "cyberNyzaUsername"
    );


    if (!username) {

      username =
      "User-" +
      user.uid.substring(0, 5);

    }


    const userRef =
    doc(
      db,
      "users",
      user.uid
    );


    const existing =
    await getDoc(userRef);


    if (existing.exists()) {

      currentProfile =
      existing.data();

    }

    else {

      currentProfile = {

        username: username,

        photo:
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(username),

      };

    }


    await setDoc(
      userRef,

      {

        username:
        currentProfile.username ||
        username,

        photo:
        currentProfile.photo ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(username),

        online: true,

        updatedAt:
        serverTimestamp()

      },

      {
        merge: true
      }

    );


    currentProfile.username =
    username;


    loginScreen.style.display =
    "none";

    appScreen.style.display =
    "block";


    myName.textContent =
    username;


    const photo =
    currentProfile.photo ||
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(username);


    profileAvatar.src =
    photo;

    topAvatar.src =
    photo;


    loadUsers();

    openGlobalChat();

  }

);



/* USERS LIST */

function loadUsers() {

  const usersRef =
  collection(
    db,
    "users"
  );


  onSnapshot(
    usersRef,

    (snapshot) => {

      usersList.innerHTML =
      "";


      snapshot.forEach(
        (userDoc) => {

          const data =
          userDoc.data();


          if (
            userDoc.id ===
            currentUser.uid
          ) return;


          const item =
          document.createElement("div");

          item.className =
          "userItem";


          const img =
          document.createElement("img");

          img.className =
          "smallAvatar";

          img.src =
          data.photo ||
          "https://ui-avatars.com/api/?name=" +
          encodeURIComponent(
            data.username ||
            "User"
          );


          const info =
          document.createElement("div");

          info.className =
          "userInfo";


          const name =
          document.createElement("div");

          name.className =
          "userName";

          name.textContent =
          data.username ||
          "User";


          const online =
          document.createElement("div");

          online.className =
          data.online
          ? "online"
          : "offline";


          online.textContent =
          data.online
          ? "🟢 Online"
          : "⚫ Offline";


          info.appendChild(name);

          info.appendChild(online);


          item.appendChild(img);

          item.appendChild(info);


          item.addEventListener(
            "click",

            () => {

              openPrivateChat(
                userDoc.id,
                data
              );

            }

          );


          usersList.appendChild(
            item
          );

        }

      );

    }

  );

}



/* GLOBAL CHAT */

globalRoom.addEventListener(
  "click",

  () => {

    openGlobalChat();

  }

);


function openGlobalChat() {

  activeChat =
  "global";


  globalRoom.classList.add(
    "active"
  );


  chatTitle.textContent =
  "🌍 Global Chat";


  status.textContent =
  "🟢 Firebase connected";


  const messagesRef =
  collection(
    db,
    "messages"
  );


  listenMessages(
    messagesRef
  );

}



/* PRIVATE CHAT */

async function openPrivateChat(
  otherUserId,
  otherUser
) {

  globalRoom.classList.remove(
    "active"
  );


  const ids = [
    currentUser.uid,
    otherUserId
  ].sort();


  const chatId =
  ids.join("_");


  activeChat =
  chatId;


  chatTitle.textContent =
  "💬 " +
  (
    otherUser.username ||
    "Private Chat"
  );


  status.textContent =
  otherUser.online
  ? "🟢 Online"
  : "⚫ Offline";


  const conversationRef =
  doc(
    db,
    "conversations",
    chatId
  );


  const conversation =
  await getDoc(
    conversationRef
  );


  if (!conversation.exists()) {

    await setDoc(
      conversationRef,

      {

        participants:
        ids,

        createdAt:
        serverTimestamp()

      }

    );

  }


  const messagesRef =
  collection(
    db,
    "conversations",
    chatId,
    "messages"
  );


  listenMessages(
    messagesRef
  );

}



/* LISTEN MESSAGES */

function listenMessages(
  messagesRef
) {

  if (
    unsubscribeMessages
  ) {

    unsubscribeMessages();

  }


  const q =
  query(
    messagesRef,
    orderBy(
      "createdAt",
      "asc"
    )
  );


  unsubscribeMessages =
  onSnapshot(

    q,

    (snapshot) => {

      messages.innerHTML =
      "";


      if (
        snapshot.empty
      ) {

        messages.innerHTML =
        '<div class="empty">No messages yet. Send the first message! 👋</div>';

        return;

      }


      snapshot.forEach(
        (messageDoc) => {

          const data =
          messageDoc.data();


          const div =
          document.createElement("div");


          div.className =
          "msg";


          if (
            data.uid ===
            currentUser.uid
          ) {

            div.classList.add(
              "mine"
            );

          }


          if (
            data.uid !==
            currentUser.uid
          ) {

            const sender =
            document.createElement(
              "div"
            );

            sender.className =
            "sender";

            sender.textContent =
            data.username ||
            "User";

            div.appendChild(
              sender
            );

          }


          const text =
          document.createElement(
            "div"
          );

          text.textContent =
          data.text ||
          "";


          div.appendChild(
            text
          );


          if (
            data.createdAt
          ) {

            const time =
            document.createElement(
              "span"
            );

            time.className =
            "time";


            time.textContent =
            data.createdAt
            .toDate()
            .toLocaleString();


            div.appendChild(
              time
            );

          }


          messages.appendChild(
            div
          );

        }

      );


      messages.scrollTop =
      messages.scrollHeight;


    },

    (error) => {

      console.error(
        error
      );

      status.textContent =
      "🔴 Firebase error: " +
      error.code;

    }

  );

}



/* SEND MESSAGE */

form.addEventListener(
  "submit",

  async (e) => {

    e.preventDefault();


    const text =
    input.value.trim();


    if (!text) return;


    send.disabled =
    true;


    try {

      let messagesRef;


      if (
        activeChat ===
        "global"
      ) {

        messagesRef =
        collection(
          db,
          "messages"
        );

      }

      else {

        messagesRef =
        collection(
          db,
          "conversations",
          activeChat,
          "messages"
        );

      }


      await addDoc(

        messagesRef,

        {

          text: text,

          uid:
          currentUser.uid,

          username:
          currentProfile.username,

          photo:
          currentProfile.photo,

          createdAt:
          serverTimestamp()

        }

      );


      input.value =
      "";


    }

    catch (error) {

      console.error(
        error
      );

      alert(
        "Message error: " +
        error.code
      );

    }

    finally {

      send.disabled =
      false;

    }

  }

);



/* PROFILE PHOTO */

photoInput.addEventListener(
  "change",

  async () => {

    const file =
    photoInput.files[0];


    if (!file) return;


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      alert(
        "Please select an image."
      );

      return;

    }


    try {

      status.textContent =
      "Uploading photo...";


      const storageRef =
      ref(

        storage,

        "profilePhotos/" +
        currentUser.uid +
        "/" +
        Date.now() +
        "_" +
        file.name

      );


      await uploadBytes(
        storageRef,
        file
      );


      const photoURL =
      await getDownloadURL(
        storageRef
      );


      await updateDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {

          photo:
          photoURL

        }

      );


      currentProfile.photo =
      photoURL;


      profileAvatar.src =
      photoURL;

      topAvatar.src =
      photoURL;


      status.textContent =
      "🟢 Photo updated";


    }

    catch (error) {

      console.error(
        error
      );

      alert(
        "Photo upload error: " +
        error.code
      );

    }

  }

);



/* LOGOUT */

logoutBtn.addEventListener(
  "click",

  async () => {

    try {

      await updateDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {

          online:
          false

        }

      );


      await signOut(
        auth
      );


    }

    catch (error) {

      console.error(
        error
      );

    }

  }

);



/* TRY TO MARK OFFLINE */

window.addEventListener(
  "beforeunload",

  () => {

    if (
      currentUser
    ) {

      updateDoc(

        doc(
          db,
          "users",
          currentUser.uid
        ),

        {

          online:
          false

        }

      );

    }

  }

);

</script>

</body>
</html>
