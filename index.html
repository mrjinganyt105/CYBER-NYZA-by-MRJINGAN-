<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER NYZA Chat</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#080b12;color:#fff;min-height:100vh;display:flex;justify-content:center}
    .app{width:100%;max-width:700px;min-height:100vh;background:#111827}
    header{background:linear-gradient(135deg,#3f51b5,#243b8f);padding:28px 18px;text-align:center;font-size:28px;font-weight:800;letter-spacing:1px}
    #status{padding:10px;text-align:center;color:#b9c2d0;font-size:14px;border-bottom:1px solid #263142}
    #messages{height:calc(100vh - 180px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
    .msg{background:#1f2937;padding:11px 14px;border-radius:14px;max-width:82%;align-self:flex-start;word-break:break-word}
    .msg .time{display:block;color:#93a4b8;font-size:10px;margin-top:5px}
    .empty{color:#8491a3;text-align:center;margin-top:40px}
    .bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:700px;padding:12px;background:#111827;border-top:1px solid #263142;display:flex;gap:8px}
    input{flex:1;border:0;border-radius:24px;padding:14px;background:#202b3c;color:white;outline:none;font-size:16px}
    button{border:0;border-radius:24px;padding:0 20px;background:#4f63d8;color:white;font-size:16px;font-weight:bold}
    button:disabled{opacity:.5}
  </style>
</head>
<body>
  <main class="app">
    <header>CYBER NYZA CHAT</header>
    <div id="status">Connecting to Firebase...</div>
    <div id="messages"><div class="empty">Loading messages...</div></div>
    <form class="bar" id="form">
      <input id="message" placeholder="Type a message..." autocomplete="off">
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, query, orderBy,
      onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",
      authDomain: "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",
      projectId: "cyber-nyza-by-mrjingan-9d4c3",
      storageBucket: "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",
      messagingSenderId: "246846891948",
      appId: "1:246846891948:web:7054c940ea7b9eefce3c09"
    };

    const status = document.getElementById("status");
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const messagesRef = collection(db, "messages");
      const q = query(messagesRef, orderBy("createdAt", "asc"));

      onSnapshot(q, (snapshot) => {
        messages.innerHTML = "";
        if (snapshot.empty) {
          messages.innerHTML = '<div class="empty">No messages yet. Send the first message! 👋</div>';
        } else {
          snapshot.forEach((doc) => {
            const data = doc.data();
            const div = document.createElement("div");
            div.className = "msg";

            const text = document.createElement("div");
            text.textContent = data.text || "";
            div.appendChild(text);

            if (data.createdAt) {
              const time = document.createElement("span");
              time.className = "time";
              time.textContent = data.createdAt.toDate().toLocaleString();
              div.appendChild(time);
            }
            messages.appendChild(div);
          });
          messages.scrollTop = messages.scrollHeight;
        }
        status.textContent = "🟢 Firebase connected";
      }, (error) => {
        console.error(error);
        status.textContent = "🔴 Firebase error: " + error.code;
        messages.innerHTML = '<div class="empty">Firebase connection error. Check Firestore Database and Rules.</div>';
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        send.disabled = true;
        try {
          await addDoc(messagesRef, {
            text: text,
            createdAt: serverTimestamp()
          });
          input.value = "";
        } catch (error) {
          console.error(error);
          alert("Message send error: " + error.code);
        } finally {
          send.disabled = false;
        }
      });
    } catch (error) {
      console.error(error);
      status.textContent = "🔴 Firebase connection error";
    }
  </script>
</body>
</html>
