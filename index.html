<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBER NYZA CHAT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b12;
  color:white;
  min-height:100vh;
}

#authScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#080b12,#151d35);
}

.authBox{
  width:100%;
  max-width:400px;
  background:#111827;
  padding:30px 20px;
  border-radius:25px;
  border:1px solid #263142;
}

.authBox h1{
  text-align:center;
  margin-bottom:10px;
  color:#ffffff;
}

.authBox p{
  text-align:center;
  color:#aab4c4;
  margin-bottom:25px;
}

.authBox input{
  width:100%;
  margin-bottom:12px;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#202b3c;
  color:white;
  font-size:16px;
  outline:none;
}

.authBox button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#4f63d8;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.switchText{
  margin-top:18px !important;
  font-size:14px;
}

.switchText span{
  color:#7185ff;
  font-weight:bold;
  cursor:pointer;
}

#app{
  display:none;
  width:100%;
  max-width:700px;
  min-height:100vh;
  margin:auto;
  background:#111827;
}

header{
  background:linear-gradient(135deg,#3f51b5,#243b8f);
  padding:22px 15px;
  text-align:center;
}

header h1{
  font-size:24px;
  letter-spacing:1px;
}

.userBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 15px;
  border-bottom:1px solid #263142;
  background:#151d29;
}

#username{
  color:#c7d2fe;
  font-weight:bold;
}

.logoutBtn{
  border:0;
  background:#d64545;
  color:white;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
}

#status{
  padding:10px;
  text-align:center;
  color:#b9c2d0;
  font-size:14px;
  border-bottom:1px solid #263142;
}

#messages{
  height:calc(100vh - 220px);
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  background:#1f2937;
  padding:12px 14px;
  border-radius:15px;
  max-width:85%;
  align-self:flex-start;
  word-break:break-word;
}

.msg.own{
  align-self:flex-end;
  background:#3f51b5;
}

.msgName{
  font-size:12px;
  font-weight:bold;
  color:#aab8ff;
  margin-bottom:5px;
}

.msg.own .msgName{
  color:#dbe2ff;
}

.time{
  display:block;
  color:#b6c0d0;
  font-size:10px;
  margin-top:6px;
}

.empty{
  color:#8491a3;
  text-align:center;
  margin-top:40px;
}

.bar{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:700px;
  padding:12px;
  background:#111827;
  border-top:1px solid #263142;
  display:flex;
  gap:8px;
}

.bar input{
  flex:1;
  border:0;
  border-radius:24px;
  padding:14px;
  background:#202b3c;
  color:white;
  outline:none;
  font-size:16px;
}

.bar button{
  border:0;
  border-radius:24px;
  padding:0 20px;
  background:#4f63d8;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.bar button:disabled{
  opacity:.5;
}

/* MEDIA + VOICE */
.mediaBtn{
  width:48px;
  min-width:48px;
  padding:0 !important;
  font-size:22px !important;
  display:flex;
  align-items:center;
  justify-content:center;
}
#mediaInput{display:none;}
.recording{background:#d64545 !important;}
.mediaImage,.mediaVideo{
  width:100%;
  max-width:320px;
  border-radius:12px;
  margin-top:4px;
  display:block;
}
.mediaAudio{width:100%;margin-top:6px;}
.fileLink{
  display:inline-block;
  color:#fff;
  background:rgba(255,255,255,.12);
  padding:10px 12px;
  border-radius:10px;
  text-decoration:none;
  margin-top:4px;
}
.uploadStatus{
  font-size:12px;
  color:#aab8ff;
  text-align:center;
  padding:4px;
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->
<div id="authScreen">

  <div class="authBox">

    <h1 id="authTitle">CYBER NYZA</h1>

    <p id="authSubtitle">Login to enter the chat</p>

    <input
      type="text"
      id="nameInput"
      placeholder="Your username"
    >

    <input
      type="email"
      id="emailInput"
      placeholder="Email address"
    >

    <input
      type="password"
      id="passwordInput"
      placeholder="Password"
    >

    <button id="authButton">Register</button>

    <p class="switchText">
      <span id="switchAuth">Already have an account? Login</span>
    </p>

  </div>

</div>


<!-- CHAT APP -->
<main id="app">

  <header>
    <h1>CYBER NYZA CHAT</h1>
  </header>

  <div class="userBar">

    <span>
      👤 <span id="username">User</span>
    </span>

    <button class="logoutBtn" id="logoutBtn">
      Logout
    </button>

  </div>

  <div id="status">
    Connecting to Firebase...
  </div>

  <div id="messages">
    <div class="empty">
      Loading messages...
    </div>
  </div>

  <form class="bar" id="form">

    <input id="mediaInput" type="file"
      accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt">

    <button id="attachBtn" class="mediaBtn" type="button">📎</button>
    <button id="voiceBtn" class="mediaBtn" type="button">🎤</button>

    <input
      id="message"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button id="send" type="submit">
      Send
    </button>

  </form>

  <div id="uploadStatus" class="uploadStatus"></div>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


const firebaseConfig = {

  apiKey: "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",

  authDomain:
  "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",

  projectId:
  "cyber-nyza-by-mrjingan-9d4c3",

  storageBucket:
  "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",

  messagingSenderId:
  "246846891948",

  appId:
  "1:246846891948:web:7054c940ea7b9eefce3c09"

};


const firebaseApp = initializeApp(firebaseConfig);

const db = getFirestore(firebaseApp);

const auth = getAuth(firebaseApp);

const storage = getStorage(firebaseApp);

const messagesRef =
collection(db, "messages");


const authScreen =
document.getElementById("authScreen");

const appScreen =
document.getElementById("app");

const authTitle =
document.getElementById("authTitle");

const authSubtitle =
document.getElementById("authSubtitle");

const nameInput =
document.getElementById("nameInput");

const emailInput =
document.getElementById("emailInput");

const passwordInput =
document.getElementById("passwordInput");

const authButton =
document.getElementById("authButton");

const switchAuth =
document.getElementById("switchAuth");

const username =
document.getElementById("username");

const logoutBtn =
document.getElementById("logoutBtn");

const status =
document.getElementById("status");

const messages =
document.getElementById("messages");

const form =
document.getElementById("form");

const input =
document.getElementById("message");

const send =
document.getElementById("send");

const attachBtn =
document.getElementById("attachBtn");

const voiceBtn =
document.getElementById("voiceBtn");

const mediaInput =
document.getElementById("mediaInput");

const uploadStatus =
document.getElementById("uploadStatus");

let mediaRecorder = null;
let audioChunks = [];
let recordingStream = null;

let loginMode = false;


switchAuth.addEventListener("click", () => {

  loginMode = !loginMode;

  if(loginMode){

    authTitle.textContent =
    "WELCOME BACK";

    authSubtitle.textContent =
    "Login to continue";

    nameInput.style.display =
    "none";

    authButton.textContent =
    "Login";

    switchAuth.textContent =
    "New user? Create account";

  }

  else{

    authTitle.textContent =
    "CYBER NYZA";

    authSubtitle.textContent =
    "Create your account";

    nameInput.style.display =
    "block";

    authButton.textContent =
    "Register";

    switchAuth.textContent =
    "Already have an account? Login";

  }

});


authButton.addEventListener(
"click",
async () => {

  const name =
  nameInput.value.trim();

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;


  if(!email || !password){

    alert(
    "Enter email and password"
    );

    return;

  }


  authButton.disabled =
  true;


  try{

    if(loginMode){

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

    else{

      if(!name){

        alert(
        "Enter your username"
        );

        authButton.disabled =
        false;

        return;

      }


      const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


      await updateProfile(
        userCredential.user,
        {
          displayName:name
        }
      );

    }


    passwordInput.value =
    "";


  }

  catch(error){

    console.error(error);

    alert(
      "Error: " +
      error.message
    );

  }

  finally{

    authButton.disabled =
    false;

  }

});


logoutBtn.addEventListener(
"click",
async () => {

  await signOut(auth);

});


onAuthStateChanged(
auth,
(user) => {

  if(user){

    authScreen.style.display =
    "none";

    appScreen.style.display =
    "block";


    username.textContent =
    user.displayName ||
    user.email;

    startChat(user);

  }

  else{

    authScreen.style.display =
    "flex";

    appScreen.style.display =
    "none";

  }

});


function startChat(user){

  const q =
  query(
    messagesRef,
    orderBy(
      "createdAt",
      "asc"
    )
  );


  onSnapshot(
  q,
  (snapshot) => {

    messages.innerHTML =
    "";


    if(snapshot.empty){

      messages.innerHTML =
      '<div class="empty">No messages yet. Send the first message! 👋</div>';

    }

    else{

      snapshot.forEach(
      (doc) => {

        const data =
        doc.data();


        const div =
        document.createElement("div");


        div.className =
        "msg";


        if(
          data.uid ===
          user.uid
        ){

          div.classList.add(
          "own"
          );

        }


        const name =
        document.createElement("div");

        name.className =
        "msgName";

        name.textContent =
        data.name ||
        "User";


        const content =
        document.createElement("div");

        if(data.type === "image" && data.url){

          const image =
          document.createElement("img");

          image.src = data.url;
          image.alt = data.fileName || "Image";
          image.className = "mediaImage";

          content.appendChild(image);

        }

        else if(data.type === "video" && data.url){

          const video =
          document.createElement("video");

          video.src = data.url;
          video.controls = true;
          video.playsInline = true;
          video.className = "mediaVideo";

          content.appendChild(video);

        }

        else if(data.type === "audio" && data.url){

          const audio =
          document.createElement("audio");

          audio.src = data.url;
          audio.controls = true;
          audio.className = "mediaAudio";

          content.appendChild(audio);

        }

        else if(data.type === "file" && data.url){

          const link =
          document.createElement("a");

          link.href = data.url;
          link.target = "_blank";
          link.rel = "noopener";
          link.className = "fileLink";
          link.textContent =
          "📄 " + (data.fileName || "Open file");

          content.appendChild(link);

        }

        else{

          content.textContent =
          data.text || "";

        }

        div.appendChild(name);
        div.appendChild(content);

        if(data.createdAt){

          const time =
          document.createElement("span");

          time.className =
          "time";

          time.textContent =
          data.createdAt
          .toDate()
          .toLocaleString();


          div.appendChild(time);

        }


        messages.appendChild(div);

      });


      messages.scrollTop =
      messages.scrollHeight;

    }


    status.textContent =
    "🟢 Connected";

  },

  (error) => {

    console.error(error);

    status.textContent =
    "🔴 Firebase error: " +
    error.code;

  });

}


form.addEventListener(
"submit",
async (e) => {

  e.preventDefault();


  const text =
  input.value.trim();


  if(!text) return;


  const user =
  auth.currentUser;


  if(!user){

    alert(
    "Please login first"
    );

    return;

  }


  send.disabled =
  true;


  try{

    await addDoc(
    messagesRef,
    {

      text:text,

      name:
      user.displayName ||
      user.email,

      uid:
      user.uid,

      createdAt:
      serverTimestamp()

    });


    input.value =
    "";


  }

  catch(error){

    console.error(error);

    alert(
      "Message send error: " +
      error.code
    );

  }

  finally{

    send.disabled =
    false;

  }

});

/* MEDIA UPLOAD + VOICE MESSAGE */

function safeFileName(name){
  return (name || "file").replace(/[^a-zA-Z0-9._-]/g, "_");
}

function getMessageType(file){
  if(file.type.startsWith("image/")) return "image";
  if(file.type.startsWith("video/")) return "video";
  if(file.type.startsWith("audio/")) return "audio";
  return "file";
}

async function sendMedia(file, forcedType = null){

  const user = auth.currentUser;

  if(!user){
    alert("Please login first");
    return;
  }

  if(!file) return;

  if(file.size > 25 * 1024 * 1024){
    alert("Please choose a file smaller than 25 MB");
    return;
  }

  const type = forcedType || getMessageType(file);
  const fileName = safeFileName(file.name);

  const storagePath =
  "messages/" + user.uid + "/" + Date.now() + "_" + fileName;

  try{

    attachBtn.disabled = true;
    voiceBtn.disabled = true;
    send.disabled = true;

    uploadStatus.textContent =
    "Uploading " + fileName + "...";

    const storageRef = ref(storage, storagePath);

    await uploadBytes(
      storageRef,
      file,
      {contentType:file.type || undefined}
    );

    const url =
    await getDownloadURL(storageRef);

    await addDoc(
      messagesRef,
      {
        type:type,
        url:url,
        fileName:file.name || fileName,
        name:user.displayName || user.email,
        uid:user.uid,
        createdAt:serverTimestamp()
      }
    );

    uploadStatus.textContent = "✅ Sent successfully";

    setTimeout(() => {
      uploadStatus.textContent = "";
    }, 2500);

  }

  catch(error){

    console.error(error);
    uploadStatus.textContent = "";

    alert(
      "Upload error: " +
      (error.code || error.message)
    );

  }

  finally{

    attachBtn.disabled = false;
    voiceBtn.disabled = false;
    send.disabled = false;
    mediaInput.value = "";

  }

}

attachBtn.addEventListener(
"click",
() => mediaInput.click()
);

mediaInput.addEventListener(
"change",
async () => {

  const file = mediaInput.files[0];

  if(file){
    await sendMedia(file);
  }

}
);

voiceBtn.addEventListener(
"click",
async () => {

  if(
    !mediaRecorder ||
    mediaRecorder.state === "inactive"
  ){

    try{

      recordingStream =
      await navigator.mediaDevices.getUserMedia(
        {audio:true}
      );

      audioChunks = [];

      mediaRecorder =
      new MediaRecorder(recordingStream);

      mediaRecorder.ondataavailable =
      (event) => {
        if(event.data.size > 0){
          audioChunks.push(event.data);
        }
      };

      mediaRecorder.onstop =
      async () => {

        const mimeType =
        mediaRecorder.mimeType || "audio/webm";

        const extension =
        mimeType.includes("mp4") ? "m4a" : "webm";

        const audioBlob =
        new Blob(
          audioChunks,
          {type:mimeType}
        );

        const audioFile =
        new File(
          [audioBlob],
          "voice-" + Date.now() + "." + extension,
          {type:mimeType}
        );

        if(recordingStream){
          recordingStream
          .getTracks()
          .forEach(track => track.stop());
          recordingStream = null;
        }

        voiceBtn.classList.remove("recording");
        voiceBtn.textContent = "🎤";

        uploadStatus.textContent =
        "Sending voice message...";

        await sendMedia(
          audioFile,
          "audio"
        );

      };

      mediaRecorder.start();

      voiceBtn.classList.add("recording");
      voiceBtn.textContent = "⏹️";

      uploadStatus.textContent =
      "🔴 Recording... Tap ⏹️ to send";

    }

    catch(error){

      console.error(error);

      alert(
        "Microphone permission is required for voice messages."
      );

    }

  }

  else if(mediaRecorder.state === "recording"){

    uploadStatus.textContent =
    "Processing voice message...";

    mediaRecorder.stop();

  }

}
);

</script>

</body>
</html>
