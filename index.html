<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Nysa Chat</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  background:#111827;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  max-width:700px;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#111827;
}

/* HEADER */
.header{
  height:92px;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:13px;
  background:linear-gradient(135deg,#315fc5,#486dcc);
  box-shadow:0 2px 10px rgba(0,0,0,.25);
  flex-shrink:0;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#f3f4f6;
  color:#3657a8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.header-info{
  flex:1;
}

.header-name{
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

.status{
  margin-top:5px;
  font-size:16px;
  color:#e5e7eb;
}

.menu{
  font-size:26px;
  cursor:pointer;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  gap:12px;
  background:#111827;
}

.message{
  max-width:78%;
  padding:12px 15px;
  font-size:18px;
  line-height:1.35;
  border-radius:20px;
  word-wrap:break-word;
  animation:pop .2s ease;
}

.received{
  align-self:flex-start;
  background:#374151;
  border-bottom-left-radius:5px;
}

.sent{
  align-self:flex-end;
  background:#3f64c6;
  border-bottom-right-radius:5px;
}

.time{
  display:block;
  font-size:10px;
  opacity:.7;
  text-align:right;
  margin-top:4px;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.9);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* INPUT */
.input-area{
  padding:10px;
  display:flex;
  gap:9px;
  background:#1f2937;
  border-top:1px solid #374151;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
}

#messageInput{
  flex:1;
  border:none;
  outline:none;
  background:#374151;
  color:white;
  border-radius:25px;
  padding:14px 17px;
  font-size:17px;
}

#messageInput::placeholder{
  color:#9ca3af;
}

.send-btn{
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#4168cf;
  color:white;
  font-size:23px;
  cursor:pointer;
}

.send-btn:active{
  transform:scale(.92);
}

/* CONTACT BUTTON */
.contacts-btn{
  position:fixed;
  top:105px;
  right:15px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:#4168cf;
  color:white;
  font-size:22px;
  cursor:pointer;
  z-index:5;
}

/* CONTACT PANEL */
.panel{
  position:fixed;
  top:0;
  left:-100%;
  width:85%;
  max-width:350px;
  height:100%;
  background:#1f2937;
  z-index:20;
  transition:.3s;
  box-shadow:5px 0 20px rgba(0,0,0,.4);
}

.panel.open{
  left:0;
}

.panel-header{
  padding:30px 20px 20px;
  font-size:24px;
  font-weight:bold;
  background:#315fc5;
}

.contact{
  padding:18px;
  border-bottom:1px solid #374151;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
}

.contact-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#4168cf;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.contact-name{
  font-size:18px;
}

.close{
  float:right;
  cursor:pointer;
}

/* OVERLAY */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:15;
}

.overlay.show{
  display:block;
}

@media(min-width:701px){
  .app{
    border-left:1px solid #374151;
    border-right:1px solid #374151;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="avatar" id="avatar">C</div>

    <div class="header-info">
      <div class="header-name" id="chatName">CYBER NYZA</div>
      <div class="status">🟢 Online</div>
    </div>

    <div class="menu">⋮</div>
  </div>

  <!-- CONTACT BUTTON -->
  <button class="contacts-btn" onclick="openContacts()">☰</button>

  <!-- CHAT -->
  <div class="chat" id="chat">
    <div class="message received">
      Hi 👋 Welcome to CYBER NYZA!
      <span class="time">Online</span>
    </div>

    <div class="message received">
      How can I help you today? 😊
      <span class="time">Now</span>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
      onkeypress="checkEnter(event)"
    >

    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>

</div>

<!-- CONTACTS -->
<div class="overlay" id="overlay" onclick="closeContacts()"></div>

<div class="panel" id="panel">

  <div class="panel-header">
    Chats
    <span class="close" onclick="closeContacts()">✕</span>
  </div>

  <div class="contact" onclick="changeChat('CYBER NYZA','C')">
    <div class="contact-avatar">C</div>
    <div>
      <div class="contact-name">CYBER NYZA</div>
      <small>Online</small>
    </div>
  </div>

  <div class="contact" onclick="changeChat('Rahul','R')">
    <div class="contact-avatar">R</div>
    <div>
      <div class="contact-name">Rahul</div>
      <small>Hey! How are you?</small>
    </div>
  </div>

  <div class="contact" onclick="changeChat('Anjali','A')">
    <div class="contact-avatar">A</div>
    <div>
      <div class="contact-name">Anjali</div>
      <small>Typing...</small>
    </div>
  </div>

  <div class="contact" onclick="changeChat('Arjun','A')">
    <div class="contact-avatar">A</div>
    <div>
      <div class="contact-name">Arjun</div>
      <small>See you soon 👋</small>
    </div>
  </div>

</div>

<script>

let currentChat = "CYBER NYZA";

function getTime(){
  const now = new Date();
  return now.toLocaleTimeString([], {
    hour:"2-digit",
    minute:"2-digit"
  });
}

function sendMessage(){

  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if(text === "") return;

  const chat = document.getElementById("chat");

  const message = document.createElement("div");

  message.className = "message sent";

  message.innerHTML =
    text +
    '<span class="time">' +
    getTime() +
    '</span>';

  chat.appendChild(message);

  input.value = "";

  chat.scrollTop = chat.scrollHeight;

  /* DEMO AUTO REPLY */

  setTimeout(function(){

    const reply = document.createElement("div");

    reply.className = "message received";

    reply.innerHTML =
      getReply(text) +
      '<span class="time">' +
      getTime() +
      '</span>';

    chat.appendChild(reply);

    chat.scrollTop = chat.scrollHeight;

  },800);
}

function getReply(text){

  text = text.toLowerCase();

  if(text.includes("hello") || text.includes("hi")){
    return "Hello 👋 How are you?";
  }

  if(text.includes("how are you")){
    return "I'm doing great 😊 What about you?";
  }

  if(text.includes("bye")){
    return "Bye 👋 See you soon!";
  }

  return "Nice message 😊 I received it!";
}

function checkEnter(event){

  if(event.key === "Enter"){
    sendMessage();
  }

}

function openContacts(){

  document.getElementById("panel")
    .classList.add("open");

  document.getElementById("overlay")
    .classList.add("show");
}

function closeContacts(){

  document.getElementById("panel")
    .classList.remove("open");

  document.getElementById("overlay")
    .classList.remove("show");
}

function changeChat(name,letter){

  currentChat = name;

  document.getElementById("chatName")
    .innerText = name;

  document.getElementById("avatar")
    .innerText = letter;

  const chat = document.getElementById("chat");

  chat.innerHTML =
    '<div class="message received">Hi 👋 This is ' +
    name +
    '!<span class="time">Now</span></div>';

  closeContacts();

}

</script>

</body>
</html>
