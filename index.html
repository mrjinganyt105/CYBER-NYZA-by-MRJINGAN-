<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CYBER NYZA Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      background: #111827;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1d4ed8;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .status {
      text-align: center;
      font-size: 12px;
      padding: 8px;
      color: #94a3b8;
      background: #0f172a;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      background: #1e293b;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
      align-self: flex-start;
    }

    .message-time {
      display: block;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 5px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #0f172a;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px;
      border-radius: 25px;
      font-size: 16px;
      background: #1e293b;
      color: white;
    }

    button {
      border: none;
      padding: 0 22px;
      border-radius: 25px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      CYBER NYZA CHAT
    </header>

    <div class="status" id="status">
      Connecting to Firebase...
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
      >

      <button onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // FIREBASE CONFIG

    const firebaseConfig = {
      apiKey: "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",
      authDomain: "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",
      projectId: "cyber-nyza-by-mrjingan-9d4c3",
      storageBucket: "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",
      messagingSenderId: "246846891948",
      appId: "1:246846891948:web:7054c940ea7b9eefce3c09"
    };


    // INITIALIZE FIREBASE

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    const messagesDiv =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const status =
      document.getElementById("status");


    // SEND MESSAGE

    window.sendMessage = async function () {

      const text =
        messageInput.value.trim();

      if (!text) return;

      try {

        await addDoc(
          collection(db, "messages"),
          {
            text: text,
            createdAt: serverTimestamp()
          }
        );

        messageInput.value = "";

      }

      catch (error) {

        console.error(error);

        alert(
          "Message sending error. Check Firestore Rules."
        );

      }

    };


    // ENTER KEY SEND

    messageInput.addEventListener(
      "keypress",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    // LOAD MESSAGES LIVE

    const q = query(
      collection(db, "messages"),
      orderBy("createdAt", "asc")
    );


    onSnapshot(
      q,

      function(snapshot) {

        messagesDiv.innerHTML = "";

        snapshot.forEach(
          function(doc) {

            const data = doc.data();

            const message =
              document.createElement("div");

            message.className =
              "message";

            const text =
              document.createElement("div");

            text.textContent =
              data.text || "";

            message.appendChild(text);

            messagesDiv.appendChild(
              message
            );

          }
        );

        messagesDiv.scrollTop =
          messagesDiv.scrollHeight;

        status.textContent =
          "Connected to Firebase 🟢";

      },

      function(error) {

        console.error(error);

        status.textContent =
          "Firebase connection error 🔴";

      }

    );

  </script>

</body>
</html>
