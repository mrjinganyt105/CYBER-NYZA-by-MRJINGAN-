<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBER NYZA - Real-time Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#1d2850 0%,transparent 40%),
        radial-gradient(circle at bottom right,#2d1658 0%,transparent 40%),
        #080d1c;
    color:white;
}

/* AUTH PAGE */

#authPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:480px;
    padding:45px 35px;
    border:1px solid #33415f;
    border-radius:35px;
    background:rgba(17,24,43,.88);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 70px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    margin-bottom:40px;
}

.logo h1{
    font-size:42px;
    letter-spacing:2px;
    font-weight:800;
}

.logo .bolt{
    color:#ffc400;
    margin-right:8px;
}

.logo p{
    margin-top:12px;
    color:#aab4c8;
    font-size:20px;
}

.by{
    color:#7286ff;
    font-size:14px;
    margin-top:8px;
}

.tabs{
    display:flex;
    background:#0b1121;
    border-radius:15px;
    padding:5px;
    margin-bottom:25px;
}

.tab{
    flex:1;
    padding:14px;
    border:none;
    border-radius:11px;
    background:transparent;
    color:#aab4c8;
    font-size:16px;
    cursor:pointer;
}

.tab.active{
    background:linear-gradient(135deg,#3567d6,#7137c8);
    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#c4cce0;
}

.input-group input{
    width:100%;
    padding:17px;
    border-radius:15px;
    border:1px solid #34425f;
    background:#0a1020;
    color:white;
    outline:none;
    font-size:16px;
}

.input-group input:focus{
    border-color:#587cff;
}

.main-btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    color:white;
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(90deg,#3567d6,#7137c8);
    transition:.2s;
}

.main-btn:hover{
    transform:translateY(-2px);
}

.error{
    color:#ff7b7b;
    text-align:center;
    margin-top:15px;
    min-height:20px;
}

.success{
    color:#63e6a6;
}

/* CHAT PAGE */

#chatPage{
    display:none;
    min-height:100vh;
}

.chat-app{
    max-width:900px;
    margin:auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:rgba(8,13,28,.65);
    border-left:1px solid #1f2b45;
    border-right:1px solid #1f2b45;
}

.header{
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #24314c;
    background:rgba(12,18,35,.95);
}

.header-logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-logo .icon{
    font-size:28px;
    color:#ffc400;
}

.header-logo h2{
    font-size:21px;
}

.header-logo span{
    display:block;
    font-size:12px;
    color:#9da9c2;
    margin-top:3px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-name{
    text-align:right;
}

.user-name strong{
    display:block;
    font-size:14px;
}

.online{
    font-size:11px;
    color:#64e99d;
}

.logout-btn{
    border:none;
    background:#202b44;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

.messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.welcome{
    text-align:center;
    color:#9da9c2;
    margin:auto;
}

.message{
    max-width:78%;
    padding:12px 15px;
    border-radius:18px;
    background:#19243b;
    align-self:flex-start;
    word-wrap:break-word;
}

.message.mine{
    align-self:flex-end;
    background:linear-gradient(135deg,#3567d6,#6735bb);
}

.sender{
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
    color:#9eb5ff;
}

.message.mine .sender{
    color:#ddd2ff;
}

.message-text{
    font-size:16px;
    line-height:1.4;
}

.message-time{
    font-size:10px;
    opacity:.65;
    margin-top:7px;
    text-align:right;
}

.chat-input-area{
    padding:15px;
    border-top:1px solid #24314c;
    display:flex;
    gap:10px;
    background:#0c1223;
}

#messageInput{
    flex:1;
    border:none;
    outline:none;
    padding:16px;
    border-radius:15px;
    background:#151f35;
    color:white;
    font-size:16px;
}

.send-btn{
    width:58px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-size:22px;
    background:linear-gradient(135deg,#3567d6,#7137c8);
}

@media(max-width:600px){

    .auth-box{
        padding:35px 22px;
        border-radius:28px;
    }

    .logo h1{
        font-size:34px;
    }

    .header-logo h2{
        font-size:17px;
    }

    .user-name{
        display:none;
    }

    .message{
        max-width:88%;
    }
}

/* ===== CYBER NYZA UPGRADE ===== */
.tool-btn{width:52px;border:none;border-radius:15px;cursor:pointer;color:white;font-size:19px;background:#1b2740}
#imageInput,#fileInput,#avatarInput{display:none}
.recording{background:#c7364b!important}
.chat-media{max-width:100%;border-radius:12px;margin-top:6px;display:block}
.delete-msg{border:none;background:rgba(0,0,0,.22);color:white;border-radius:8px;padding:5px 8px;font-size:11px;margin-top:8px;cursor:pointer}
.file-card{display:block;color:white;text-decoration:none;margin-top:6px;word-break:break-word}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#25314a;border:2px solid #526cba}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex}
.modal-box{width:100%;max-width:420px;background:#121b30;border:1px solid #33415f;border-radius:24px;padding:24px}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.close-btn{border:none;background:transparent;color:white;font-size:28px}
.profile-center{text-align:center}
.profile-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#25314a;border:3px solid #587cff}
.secondary-btn{margin:14px 0;border:1px solid #3b4c70;background:#1c2740;color:white;padding:10px 14px;border-radius:10px}
.profile-name{width:100%;padding:14px;border-radius:12px;border:1px solid #34425f;background:#0a1020;color:white;margin-bottom:12px}

</style>
</head>

<body>


<!-- ================= AUTH PAGE ================= -->

<div id="authPage">

    <div class="auth-box">

        <div class="logo">
            <h1><span class="bolt">⚡</span>CYBER NYZA</h1>
            <p>Real-time Chat</p>
            <div class="by">by mrjingan</div>
        </div>


        <div class="tabs">

            <button class="tab active" id="loginTab">
                Login
            </button>

            <button class="tab" id="signupTab">

<!-- ================= CHAT PAGE ================= -->

<div id="chatPage">

    <div class="chat-app">


        <!-- HEADER -->

        <div class="header">

            <div class="header-logo">

                <div class="icon">⚡</div>

                <div>
                    <h2>CYBER NYZA</h2>
                    <span>by mrjingan • Real-time Chat</span>
                </div>

            </div>


            <div class="user-area">

                <div class="user-name">

<div class="modal" id="profileModal">

   <br><button class="secondary-btn" id="avatarBtn">Change Profile Photo</button>

 </div>

<!-- ================= FIREBASE ================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp,
    deleteDoc,
    doc as firestoreDoc,
    limit
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import { getStorage, ref, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey: "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",

    authDomain: "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",

    projectId: "cyber-nyza-by-mrjingan-9d4c3",

    storageBucket: "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",

    messagingSenderId: "246846891948",

    appId: "1:246846891948:web:7054c940ea7b9eefce3c09"

};


/* ================= INITIALIZE ================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);



/* ================= ELEMENTS ================= */

const authPage = document.getElementById("authPage");

const chatPage = document.getElementById("chatPage");


const loginTab = document.getElementById("loginTab");

const signupTab = document.getElementById("signupTab");


const loginForm = document.getElementById("loginForm");

const signupForm = document.getElementById("signupForm");


const loginEmail = document.getElementById("loginEmail");

const loginPassword = document.getElementById("loginPassword");


const signupName = document.getElementById("signupName");

const signupEmail = document.getElementById("signupEmail");

const signupPassword = document.getElementById("signupPassword");


const loginBtn = document.getElementById("loginBtn");

const signupBtn = document.getElementById("signupBtn");


const authMessage = document.getElementById("authMessage");


const logoutBtn = document.getElementById("logoutBtn");

const currentUserName = document.getElementById("currentUserName");


const messages = document.getElementById("messages");

const messageInput = document.getElementById("messageInput");

const sendBtn = document.getElementById("sendBtn");



/* ================= TAB SWITCH ================= */

loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");

    signupTab.classList.remove("active");

    loginForm.classList.add("active");

    signupForm.classList.remove("active");

    authMessage.textContent = "";

});


signupTab.addEventListener("click", () => {

    signupTab.classList.add("active");

    loginTab.classList.remove("active");

    signupForm.classList.add("active");

    loginForm.classList.remove("active");

    authMessage.textContent = "";

});



/* ================= SIGN UP ================= */

signupBtn.addEventListener("click", async () => {

    const name = signupName.value.trim();

    const email = signupEmail.value.trim();

    const password = signupPassword.value;


    if(!name || !email || !password){

        authMessage.textContent =
        "Please fill all fields.";

        return;

    }


    try{

        signupBtn.textContent = "Creating...";

        signupBtn.disabled = true;


        const userCredential =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        await updateProfile(
            userCredential.user,
            {
                displayName:name
            }
        );


        authMessage.classList.add("success");

        authMessage.textContent =
        "Account created successfully!";


    }

    catch(error){

        console.error(error);

        authMessage.classList.remove("success");


        if(error.code === "auth/email-already-in-use"){

            authMessage.textContent =
            "This email is already registered.";

        }

        else if(error.code === "auth/weak-password"){

            authMessage.textContent =
            "Password must be at least 6 characters.";

        }

        else{

            authMessage.textContent =
            error.message;

        }

    }

    finally{

        signupBtn.textContent =
        "Create Account";

        signupBtn.disabled = false;

    }

});



/* ================= LOGIN ================= */

loginBtn.addEventListener("click", async () => {

    const email = loginEmail.value.trim();

    const password = loginPassword.value;


    if(!email || !password){

        authMessage.textContent =
        "Please enter email and password.";

        return;

    }


    try{

        loginBtn.textContent = "Logging in...";

        loginBtn.disabled = true;


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


    }

    catch(error){

        console.error(error);


        if(
            error.code === "auth/invalid-credential"
        ){

            authMessage.textContent =
            "Invalid email or password.";

        }

        else{

            authMessage.textContent =
            error.message;

        }

    }

    finally{

        loginBtn.textContent =
        "Login";

        loginBtn.disabled = false;

    }

});



/* ================= LOGOUT ================= */

logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

});



/* ================= AUTH STATE ================= */

onAuthStateChanged(auth, (user) => {

    if(user){

        authPage.style.display = "none";

        chatPage.style.display = "block";


        currentUserName.textContent =
        user.displayName ||
        user.email ||
        "CYBER USER";


        loadMessages();

    }

    else{

        chatPage.style.display = "none";

        authPage.style.display = "flex";

    }

});



/* ================= SEND MESSAGE ================= */

async function sendMessage(){

    const text =
    messageInput.value.trim();


    if(!text) return;


    const user = auth.currentUser;


    if(!user) return;


    try{

        sendBtn.disabled = true;


        await addDoc(
            collection(db,"messages"),
            {

                text:text,

                sender:
                user.displayName ||
                user.email ||
                "User",

                uid:user.uid,

                timestamp:
                serverTimestamp()

            }
        );


        messageInput.value = "";


    }

    catch(error){

        console.error(error);

        alert(
            "Message sending failed: " +
            error.message
        );

    }

    finally{

        sendBtn.disabled = false;

    }

}



sendBtn.addEventListener(
    "click",
    sendMessage
);



messageInput.addEventListener(
    "keydown",
    (event) => {

        if(event.key === "Enter"){

            sendMessage();

        }

    }
);



/* ================= REALTIME MESSAGES ================= */

let unsubscribeMessages = null;


function loadMessages(){


    if(unsubscribeMessages){

        unsubscribeMessages();

    }


    const messageQuery = query(

        collection(db,"messages"),

        orderBy(
            "timestamp",
            "asc"
        ),

        limit(200)

    );


    unsubscribeMessages = onSnapshot(

        messageQuery,

        (snapshot) => {


            messages.innerHTML = "";


            if(snapshot.empty){

                messages.innerHTML = `

                    <div class="welcome">

                        ⚡ Welcome to CYBER NYZA Chat<br><br>

                        Send the first message!

                    </div>

                `;

                return;

            }


            snapshot.forEach(
                (doc) => {

                    const data =
                    doc.data();


                    const messageDiv =
                    document.createElement("div");


                    const isMine =
                    data.uid ===
                    auth.currentUser.uid;


                    messageDiv.className =
                    isMine
                    ? "message mine"
                    : "message";


                    let timeText = "";


                    if(data.timestamp){

                        const date =
                        data.timestamp.toDate();


                        timeText =
                        date.toLocaleTimeString(
                            [],
                            {
                                hour:"2-digit",
                                minute:"2-digit"
                            }
                        );

                    }


                    const sender =
                    escapeHTML(
                        data.sender ||
                        "User"
                    );


                    const message =
                    escapeHTML(
                        data.text ||
                        ""
                    );


                    messageDiv.innerHTML = `
                        <div class="sender">${isMine ? "You" : sender}</div>
                        ${data.type === "image"
                          ? `<img class="chat-media" src="${data.url}" alt="Image">`
                          : data.type === "voice"
                          ? `<audio class="chat-media" controls src="${data.url}"></audio>`
                          : data.type === "file"
                          ? `<a class="file-card" href="${data.url}" target="_blank">📎 ${escapeHTML(data.fileName || "Download file")}</a>`
                          : `<div class="message-text">${message}</div>`}
                        <div class="message-time">${timeText}</div>
                        ${isMine ? `<button class="delete-msg" data-delete="${doc.id}">Delete</button>` : ""}
                    `;

                    const deleteButton = messageDiv.querySelector("[data-delete]");
                    if(deleteButton){
                        deleteButton.addEventListener("click", async () => {
                            if(confirm("Delete this message?")){
                                await deleteDoc(firestoreDoc(db,"messages",doc.id));
                            }
                        });
                    }


                    messages.appendChild(
                        messageDiv
                    );

                }
            );


            messages.scrollTop =
            messages.scrollHeight;


        },

        (error) => {

            console.error(error);


            messages.innerHTML = `

                <div class="welcome">

                    Unable to load messages.<br><br>

                    Check Firestore Database Rules.

                </div>

            `;

        }

    );

}



/* ================= SECURITY ================= */

function escapeHTML(text){

    const div =
    document.createElement("div");


    div.textContent = text;


    return div.innerHTML;

}



/* ================= UPGRADED FEATURES ================= */

const imageBtn = document.getElementById("imageBtn");
const fileBtn = document.getElementById("fileBtn");
const voiceBtn = document.getElementById("voiceBtn");
const imageInput = document.getElementById("imageInput");
const fileInput = document.getElementById("fileInput");

imageBtn.addEventListener("click", () => imageInput.click());
fileBtn.addEventListener("click", () => fileInput.click());

imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if(file) uploadAttachment(file, "image");
});

fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if(file) uploadAttachment(file, "file");
});

async function uploadAttachment(file, type){
    const user = auth.currentUser;
    if(!user) return;

    try{
        const path = `uploads/${user.uid}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
        const storageRef = ref(storage, path);

        if(type === "image") imageBtn.textContent = "…";
        else fileBtn.textContent = "…";

        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);

        await addDoc(collection(db,"messages"),{
            type,
            url,
            fileName:file.name,
            sender:user.displayName || user.email || "User",
            uid:user.uid,
            timestamp:serverTimestamp()
        });
    }
    catch(error){
        alert("Upload failed: " + error.message);
    }
    finally{
        imageBtn.textContent = "🖼️";
        fileBtn.textContent = "📎";
        imageInput.value = "";
        fileInput.value = "";
    }
}

/* VOICE MESSAGE */
let mediaRecorder = null;
let audioChunks = [];

voiceBtn.addEventListener("click", async () => {
    if(mediaRecorder && mediaRecorder.state === "recording"){
        mediaRecorder.stop();
        return;
    }

    try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.addEventListener("dataavailable", event => {
            if(event.data.size > 0) audioChunks.push(event.data);
        });

        mediaRecorder.addEventListener("stop", async () => {
            voiceBtn.classList.remove("recording");
            voiceBtn.textContent = "🎤";
            stream.getTracks().forEach(track => track.stop());

            const blob = new Blob(audioChunks,{type:"audio/webm"});
            const user = auth.currentUser;
            if(!user || !blob.size) return;

            try{
                const storageRef = ref(storage,`voice/${user.uid}/${Date.now()}.webm`);
                await uploadBytes(storageRef,blob);
                const url = await getDownloadURL(storageRef);

                await addDoc(collection(db,"messages"),{
                    type:"voice",
                    url,
                    sender:user.displayName || user.email || "User",
                    uid:user.uid,
                    timestamp:serverTimestamp()
                });
            }catch(error){
                alert("Voice upload failed: " + error.message);
            }
        });

        mediaRecorder.start();
        voiceBtn.classList.add("recording");
        voiceBtn.textContent = "■";
    }
    catch(error){
        alert("Microphone permission is required for voice messages.");
    }
});

/* PROFILE */
const profileModal = document.getElementById("profileModal");
const profileBtn = document.getElementById("profileBtn");
const closeProfile = document.getElementById("closeProfile");
const avatarBtn = document.getElementById("avatarBtn");
const avatarInput = document.getElementById("avatarInput");
const profileAvatar = document.getElementById("profileAvatar");
const profileNameInput = document.getElementById("profileNameInput");
const saveProfileBtn = document.getElementById("saveProfileBtn");
const profileMessage = document.getElementById("profileMessage");
const headerAvatar = document.getElementById("headerAvatar");

function refreshProfileUI(){
    const user = auth.currentUser;
    if(!user) return;
    const name = user.displayName || user.email || "CYBER USER";
    const fallback = "https://ui-avatars.com/api/?name=" + encodeURIComponent(name) + "&background=25314a&color=ffffff";
    currentUserName.textContent = name;
    headerAvatar.src = user.photoURL || fallback;
    profileAvatar.src = user.photoURL || fallback;
    profileNameInput.value = name;
}

profileBtn.addEventListener("click", () => {
    refreshProfileUI();
    profileModal.classList.add("show");
});

closeProfile.addEventListener("click", () => profileModal.classList.remove("show"));
avatarBtn.addEventListener("click", () => avatarInput.click());

avatarInput.addEventListener("change", async () => {
    const file = avatarInput.files[0];
    const user = auth.currentUser;
    if(!file || !user) return;

    try{
        profileMessage.textContent = "Uploading photo...";
        const storageRef = ref(storage,`profiles/${user.uid}/${Date.now()}_${file.name}`);
        await uploadBytes(storageRef,file);
        const url = await getDownloadURL(storageRef);
        await updateProfile(user,{photoURL:url});
        refreshProfileUI();
        profileMessage.textContent = "Profile photo updated!";
    }catch(error){
        profileMessage.textContent = error.message;
    }
});

saveProfileBtn.addEventListener("click", async () => {
    const name = profileNameInput.value.trim();
    if(!name) return;

    try{
        await updateProfile(auth.currentUser,{displayName:name});
        refreshProfileUI();
        profileMessage.textContent = "Profile saved!";
    }catch(error){
        profileMessage.textContent = error.message;
    }
});

const originalAuthState = onAuthStateChanged;
/* refresh avatar after auth UI changes */
setTimeout(refreshProfileUI, 500);

</script>
