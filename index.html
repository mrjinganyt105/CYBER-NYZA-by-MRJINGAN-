<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NYZA Random Video Chat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:#111827;
  color:white;
  min-height:100vh;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #293247;
  background:#151d2e;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#7c9cff;
}

.status{
  color:#aab5cc;
  font-size:14px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

#startScreen{
  min-height:75vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.startCard{
  width:100%;
  max-width:500px;
  text-align:center;
  padding:40px 25px;
  background:#1b2436;
  border:1px solid #303c55;
  border-radius:25px;
}

.startCard h1{
  font-size:32px;
  margin-bottom:15px;
}

.startCard p{
  color:#aab5cc;
  line-height:1.6;
  margin-bottom:30px;
}

button{
  border:none;
  cursor:pointer;
  transition:.2s;
}

.primary{
  background:#5b7cff;
  color:white;
  padding:16px 30px;
  border-radius:15px;
  font-size:18px;
  font-weight:700;
}

.primary:hover{
  transform:scale(1.03);
}

#chatScreen{
  display:none;
}

.videoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.videoBox{
  position:relative;
  background:#05070c;
  border-radius:20px;
  overflow:hidden;
  min-height:330px;
  border:1px solid #303c55;
}

video{
  width:100%;
  height:100%;
  min-height:330px;
  object-fit:cover;
  background:#05070c;
}

.label{
  position:absolute;
  bottom:12px;
  left:12px;
  background:rgba(0,0,0,.6);
  padding:7px 12px;
  border-radius:10px;
  font-size:14px;
}

#waiting{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aab5cc;
  font-size:20px;
  background:#111827;
}

.controls{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:20px 0;
  flex-wrap:wrap;
}

.controlBtn{
  background:#25324a;
  color:white;
  padding:14px 20px;
  border-radius:14px;
  font-size:16px;
}

.controlBtn.red{
  background:#e74c5b;
}

.controlBtn.blue{
  background:#5b7cff;
}

.chatBox{
  background:#1b2436;
  border:1px solid #303c55;
  border-radius:20px;
  padding:15px;
}

#messages{
  height:250px;
  overflow-y:auto;
  padding:10px;
}

.message{
  margin:8px 0;
  padding:10px 14px;
  border-radius:12px;
  max-width:75%;
  width:max-content;
  word-break:break-word;
}

.me{
  background:#5b7cff;
  margin-left:auto;
}

.other{
  background:#29354d;
}

.inputArea{
  display:flex;
  gap:10px;
  margin-top:10px;
}

input{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:1px solid #394967;
  background:#111827;
  color:white;
  font-size:16px;
}

.send{
  background:#5b7cff;
  color:white;
  padding:0 20px;
  border-radius:12px;
  font-weight:bold;
}

.warning{
  margin-top:15px;
  color:#8d99ae;
  font-size:13px;
  text-align:center;
}

@media(max-width:700px){

  main{
    padding:12px;
  }

  .videoGrid{
    grid-template-columns:1fr;
  }

  .videoBox,
  video{
    min-height:250px;
  }

  .controls{
    gap:8px;
  }

  .controlBtn{
    padding:12px 14px;
  }

}
</style>
</head>

<body>

<header>
  <div class="logo">NYZA CHAT</div>
  <div class="status" id="status">Connecting...</div>
</header>

<main>

<div id="startScreen">

  <div class="startCard">

    <h1>Random Video Chat</h1>

    <p>
      Meet a random person and start a private video conversation.
    </p>

    <button class="primary" id="startBtn">
      🎥 Start Chat
    </button>

    <div class="warning">
      Be respectful. Do not share personal information.
    </div>

  </div>

</div>


<div id="chatScreen">

  <div class="videoGrid">

    <div class="videoBox">

      <video id="remoteVideo" autoplay playsinline></video>

      <div id="waiting">
        Looking for someone...
      </div>

      <div class="label">
        Stranger
      </div>

    </div>


    <div class="videoBox">

      <video id="localVideo"
      autoplay
      muted
      playsinline></video>

      <div class="label">
        You
      </div>

    </div>

  </div>


  <div class="controls">

    <button class="controlBtn" id="micBtn">
      🎤 Mic
    </button>

    <button class="controlBtn" id="cameraBtn">
      📷 Camera
    </button>

    <button class="controlBtn blue" id="nextBtn">
      🔄 Next
    </button>

    <button class="controlBtn red" id="endBtn">
      ❌ End
    </button>

  </div>


  <div class="chatBox">

    <div id="messages"></div>

    <div class="inputArea">

      <input
      id="messageInput"
      placeholder="Type a message...">

      <button class="send" id="sendBtn">
        Send
      </button>

    </div>

  </div>

</div>

</main>


<script type="module">

/* ===============================
   FIREBASE IMPORTS
================================ */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  update,
  push,
  onValue,
  onChildAdded,
  remove,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* ===============================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

  apiKey:
  "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",

  authDomain:
  "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",

  databaseURL:
  "https://cyber-nyza-by-mrjingan-9d4c3-default-rtdb.firebaseio.com",

  projectId:
  "cyber-nyza-by-mrjingan-9d4c3",

  storageBucket:
  "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",

  messagingSenderId:
  "246846891948",

  appId:
  "1:246846891948:web:7054c940ea7b9eefce3c09"

};


/* ===============================
   INITIALIZE FIREBASE
================================ */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* ===============================
   HTML ELEMENTS
================================ */

const startScreen =
document.getElementById("startScreen");

const chatScreen =
document.getElementById("chatScreen");

const startBtn =
document.getElementById("startBtn");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");

const waiting =
document.getElementById("waiting");

const statusText =
document.getElementById("status");

const micBtn =
document.getElementById("micBtn");

const cameraBtn =
document.getElementById("cameraBtn");

const nextBtn =
document.getElementById("nextBtn");

const endBtn =
document.getElementById("endBtn");

const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");


/* ===============================
   GLOBAL VARIABLES
================================ */

let currentUser = null;

let localStream = null;

let peerConnection = null;

let currentRoomId = null;

let isCaller = false;

let micEnabled = true;

let cameraEnabled = true;

let roomListener = null;

let messageListener = null;


/* ===============================
   WEBRTC CONFIG
================================ */

const rtcConfig = {

  iceServers: [

    {
      urls:
      "stun:stun.l.google.com:19302"
    },

    {
      urls:
      "stun:stun1.l.google.com:19302"
    }

  ]

};


/* ===============================
   FIREBASE LOGIN
================================ */

onAuthStateChanged(auth, user => {

  if(user){

    currentUser = user;

    statusText.textContent =
    "Ready to chat";

  }

});


signInAnonymously(auth)
.catch(error => {

  console.error(error);

  statusText.textContent =
  "Firebase login error";

});


/* ===============================
   START CAMERA
================================ */

async function startCamera(){

  if(localStream){
    return;
  }

  localStream =
  await navigator.mediaDevices.getUserMedia({

    video:true,
    audio:true

  });

  localVideo.srcObject =
  localStream;

}


/* ===============================
   CREATE PEER CONNECTION
================================ */

function createPeerConnection(){

  peerConnection =
  new RTCPeerConnection(rtcConfig);


  localStream
  .getTracks()
  .forEach(track => {

    peerConnection.addTrack(
      track,
      localStream
    );

  });


  peerConnection.ontrack =
  event => {

    remoteVideo.srcObject =
    event.streams[0];

    waiting.style.display =
    "none";

  };


  peerConnection.onicecandidate =
  event => {

    if(!event.candidate){
      return;
    }

    if(isCaller){

      push(
        ref(
          db,
          "videoCalls/" +
          currentRoomId +
          "/callerCandidates"
        ),
        event.candidate.toJSON()
      );

    }else{

      push(
        ref(
          db,
          "videoCalls/" +
          currentRoomId +
          "/calleeCandidates"
        ),
        event.candidate.toJSON()
      );

    }

  };

}


/* ===============================
   FIND RANDOM USER
================================ */

async function findRandomUser(){

  statusText.textContent =
  "Looking for someone...";

  waiting.style.display =
  "flex";


  const myWaitingRef =
  ref(
    db,
    "videoWaiting/" +
    currentUser.uid
  );


  await set(
    myWaitingRef,
    {
      uid:currentUser.uid,
      status:"waiting",
      createdAt:Date.now()
    }
  );


  onValue(
    myWaitingRef,
    async snapshot => {

      const data =
      snapshot.val();

      if(
        data &&
        data.status === "matched" &&
        data.roomId &&
        data.partnerId
      ){

        currentRoomId =
        data.roomId;

        if(
          data.partnerId ===
          currentUser.uid
        ){
          return;
        }

        isCaller = false;

        statusText.textContent =
        "Connected";

        await joinCall();

      }

    }
  );


  const waitingRef =
  ref(
    db,
    "videoWaiting"
  );


  const snapshot =
  await get(waitingRef);


  if(!snapshot.exists()){
    return;
  }


  const users =
  snapshot.val();


  for(
    const uid in users
  ){

    if(
      uid === currentUser.uid
    ){
      continue;
    }


    const person =
    users[uid];


    if(
      person.status !== "waiting"
    ){
      continue;
    }


    const roomId =
    "room_" +
    Date.now() +
    "_" +
    Math.random()
    .toString(36)
    .substring(2);


    const personRef =
    ref(
      db,
      "videoWaiting/" + uid
    );


    const result =
    await runTransaction(
      personRef,
      current => {

        if(
          current === null ||
          current.status !== "waiting"
        ){
          return;
        }

        return {

          ...current,

          status:"matched",

          roomId:roomId,

          partnerId:
          currentUser.uid

        };

      }
    );


    if(result.committed){

      currentRoomId =
      roomId;

      isCaller = true;


      await update(
        myWaitingRef,
        {
          status:"matched",
          roomId:roomId,
          partnerId:uid
        }
      );


      statusText.textContent =
      "Connecting...";


      await createCall();

      return;

    }

  }

}


/* ===============================
   CREATE CALL
================================ */

async function createCall(){

  createPeerConnection();


  const roomRef =
  ref(
    db,
    "videoCalls/" +
    currentRoomId
  );


  const offer =
  await peerConnection
  .createOffer();


  await peerConnection
  .setLocalDescription(
    offer
  );


  await set(
    roomRef,
    {
      caller:
      currentUser.uid,

      offer:{

        type:offer.type,

        sdp:offer.sdp

      },

      createdAt:
      Date.now()

    }
  );


  onValue(
    roomRef,
    async snapshot => {

      const data =
      snapshot.val();

      if(
        !data ||
        !peerConnection
      ){
        return;
      }


      if(
        data.answer &&
        !peerConnection.currentRemoteDescription
      ){

        await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );

      }

    }
  );


  onChildAdded(
    ref(
      db,
      "videoCalls/" +
      currentRoomId +
      "/calleeCandidates"
    ),
    snapshot => {

      const candidate =
      snapshot.val();


      if(
        candidate &&
        peerConnection
      ){

        peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        )
        .catch(console.error);

      }

    }
  );

}


/* ===============================
   JOIN CALL
================================ */

async function joinCall(){

  const roomRef =
  ref(
    db,
    "videoCalls/" +
    currentRoomId
  );


  const snapshot =
  await get(roomRef);


  const room =
  snapshot.val();


  if(
    !room ||
    !room.offer
  ){
    return;
  }


  createPeerConnection();


  await peerConnection
  .setRemoteDescription(

    new RTCSessionDescription(
      room.offer
    )

  );


  const answer =
  await peerConnection
  .createAnswer();


  await peerConnection
  .setLocalDescription(
    answer
  );


  await update(
    roomRef,
    {

      answer:{

        type:answer.type,

        sdp:answer.sdp

      }

    }
  );


  onChildAdded(
    ref(
      db,
      "videoCalls/" +
      currentRoomId +
      "/callerCandidates"
    ),
    snapshot => {

      const candidate =
      snapshot.val();


      if(
        candidate &&
        peerConnection
      ){

        peerConnection
        .addIceCandidate(

          new RTCIceCandidate(
            candidate
          )

        )
        .catch(console.error);

      }

    }
  );


  listenMessages();

}


/* ===============================
   START RANDOM CHAT
================================ */

startBtn.onclick =
async () => {

  if(!currentUser){

    alert(
      "Please wait. Connecting to Firebase..."
    );

    return;

  }


  try{

    await startCamera();

    startScreen.style.display =
    "none";

    chatScreen.style.display =
    "block";


    findRandomUser();


    setTimeout(() => {

      if(
        currentRoomId &&
        isCaller
      ){

        listenMessages();

      }

    },2000);


  }catch(error){

    console.error(error);

    alert(
      "Camera and microphone permission is required."
    );

  }

};


/* ===============================
   TEXT CHAT
================================ */

function listenMessages(){

  if(!currentRoomId){
    return;
  }


  messages.innerHTML =
  "";


  const messageRef =
  ref(
    db,
    "videoCalls/" +
    currentRoomId +
    "/messages"
  );


  onChildAdded(
    messageRef,
    snapshot => {

      const data =
      snapshot.val();


      const div =
      document.createElement(
        "div"
      );


      div.className =
      "message " +
      (
        data.uid ===
        currentUser.uid
        ? "me"
        : "other"
      );


      div.textContent =
      data.text;


      messages
      .appendChild(div);


      messages.scrollTop =
      messages.scrollHeight;

    }
  );

}


async function sendMessage(){

  const text =
  messageInput.value.trim();


  if(
    !text ||
    !currentRoomId
  ){
    return;
  }


  await push(
    ref(
      db,
      "videoCalls/" +
      currentRoomId +
      "/messages"
    ),
    {

      uid:
      currentUser.uid,

      text:text,

      time:
      Date.now()

    }
  );


  messageInput.value =
  "";

}


sendBtn.onclick =
sendMessage;


messageInput
.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){
      sendMessage();
    }

  }
);


/* ===============================
   MIC CONTROL
================================ */

micBtn.onclick =
() => {

  if(!localStream){
    return;
  }


  micEnabled =
  !micEnabled;


  localStream
  .getAudioTracks()
  .forEach(track => {

    track.enabled =
    micEnabled;

  });


  micBtn.textContent =
  micEnabled
  ? "🎤 Mic"
  : "🔇 Mic Off";

};


/* ===============================
   CAMERA CONTROL
================================ */

cameraBtn.onclick =
() => {

  if(!localStream){
    return;
  }


  cameraEnabled =
  !cameraEnabled;


  localStream
  .getVideoTracks()
  .forEach(track => {

    track.enabled =
    cameraEnabled;

  });


  cameraBtn.textContent =
  cameraEnabled
  ? "📷 Camera"
  : "🚫 Camera Off";

};


/* ===============================
   CLEANUP
================================ */

async function cleanup(){

  if(peerConnection){

    peerConnection.close();

    peerConnection =
    null;

  }


  if(currentRoomId){

    await remove(
      ref(
        db,
        "videoCalls/" +
        currentRoomId
      )
    );

  }


  if(currentUser){

    await remove(
      ref(
        db,
        "videoWaiting/" +
        currentUser.uid
      )
    );

  }


  currentRoomId =
  null;


  messages.innerHTML =
  "";


  waiting.style.display =
  "flex";

}


/* ===============================
   NEXT USER
================================ */

nextBtn.onclick =
async () => {

  await cleanup();

  await findRandomUser();

};


/* ===============================
   END CHAT
================================ */

endBtn.onclick =
async () => {

  await cleanup();


  if(localStream){

    localStream
    .getTracks()
    .forEach(track =>
      track.stop()
    );

    localStream =
    null;

  }


  localVideo.srcObject =
  null;

  remoteVideo.srcObject =
  null;


  chatScreen.style.display =
  "none";

  startScreen.style.display =
  "flex";


  statusText.textContent =
  "Ready to chat";

};


/* ===============================
   PAGE CLOSE CLEANUP
================================ */

window.addEventListener(
  "beforeunload",
  () => {

    if(
      currentUser
    ){

      remove(
        ref(
          db,
          "videoWaiting/" +
          currentUser.uid
        )
      );

    }

  }
);

</script>

</body>
</html>
