<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CYBER NYZA Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111b21;
    color:white;
    height:100vh;
    overflow:hidden;
}

button{
    cursor:pointer;
}

/* LOGIN */

#loginPage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111b21,#0b141a);
}

.loginBox{
    width:90%;
    max-width:400px;
    background:#202c33;
    padding:30px;
    border-radius:15px;
    text-align:center;
}

.logo{
    font-size:35px;
    font-weight:bold;
    color:#00a884;
    margin-bottom:10px;
}

.loginBox p{
    color:#aaa;
    margin-bottom:25px;
}

.loginBox input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    background:#2a3942;
    color:white;
    font-size:16px;
}

.loginBox button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#00a884;
    color:white;
    font-size:16px;
    font-weight:bold;
}

/* APP */

#app{
    display:none;
    height:100vh;
}

.appHeader{
    height:65px;
    background:#202c33;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.appHeader h2{
    color:#00a884;
}

.headerButtons button{
    background:#00a884;
    color:white;
    border:none;
    padding:8px 12px;
    margin-left:5px;
    border-radius:6px;
}

/* MAIN */

.main{
    display:flex;
    height:calc(100vh - 65px);
}

/* SIDEBAR */

.sidebar{
    width:350px;
    background:#111b21;
    border-right:1px solid #2a3942;
    display:flex;
    flex-direction:column;
}

.sidebarTop{
    padding:15px;
    border-bottom:1px solid #2a3942;
}

.userInfo{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.userInfo small{
    color:#aaa;
}

.newButtons{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.newButtons button{
    flex:1;
    border:none;
    padding:10px;
    background:#2a3942;
    color:white;
    border-radius:6px;
}

.chatList{
    overflow-y:auto;
    flex:1;
}

.chatItem{
    padding:15px;
    border-bottom:1px solid #202c33;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
}

.chatItem:hover{
    background:#202c33;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#00a884;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.chatName{
    font-size:16px;
}

/* CHAT AREA */

.chatArea{
    flex:1;
    display:flex;
    flex-direction:column;
    background:#0b141a;
}

.emptyChat{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:#8696a0;
}

.chatHeader{
    height:65px;
    background:#202c33;
    display:none;
    align-items:center;
    padding:0 20px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:none;
}

.message{
    max-width:70%;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    word-wrap:break-word;
}

.sent{
    background:#005c4b;
    margin-left:auto;
}

.received{
    background:#202c33;
}

.sender{
    font-size:11px;
    color:#00a884;
    margin-bottom:5px;
}

.messageTime{
    font-size:10px;
    color:#aaa;
    text-align:right;
    margin-top:4px;
}

.messageBox{
    display:none;
    padding:10px;
    background:#202c33;
    gap:10px;
}

.messageBox input{
    flex:1;
    padding:13px;
    border:none;
    border-radius:25px;
    background:#2a3942;
    color:white;
    font-size:16px;
}

.messageBox button{
    border:none;
    padding:12px 20px;
    border-radius:25px;
    background:#00a884;
    color:white;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        width:100%;
    }

    .chatArea{
        display:none;
    }

    .main.chatOpen .sidebar{
        display:none;
    }

    .main.chatOpen .chatArea{
        display:flex;
    }

}

</style>

</head>

<body>


<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="loginBox">

<div class="logo">CYBER NYZA</div>

<p>Personal & Group Chat</p>

<input
type="email"
id="email"
placeholder="Email Address"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="login()">
Login
</button>

<button onclick="signup()">
Create Account
</button>

</div>

</div>


<!-- MAIN APP -->

<div id="app">

<div class="appHeader">

<h2>CYBER NYZA</h2>

<div class="headerButtons">

<button onclick="logoutUser()">
Logout
</button>

</div>

</div>


<div class="main" id="main">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="sidebarTop">

<div class="userInfo">

<div>

<b id="currentUser">
Loading...
</b>

<br>

<small id="currentEmail"></small>

</div>

</div>


<div class="newButtons">

<button onclick="newPersonalChat()">
+ Personal
</button>

<button onclick="newGroup()">
+ Group
</button>

</div>

</div>


<div
class="chatList"
id="chatList"
>

</div>

</div>


<!-- CHAT AREA -->

<div class="chatArea">

<div
class="emptyChat"
id="emptyChat"
>

<h2>CYBER NYZA</h2>

<p>Select a chat to start messaging</p>

</div>


<div
class="chatHeader"
id="chatHeader"
>

<b id="chatTitle">
Chat
</b>

</div>


<div
class="messages"
id="messages"
>

</div>


<div
class="messageBox"
id="messageBox"
>

<input
id="messageInput"
placeholder="Type a message..."
onkeypress="checkEnter(event)"
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>

</div>



<!-- FIREBASE -->

<script type="module">

import {
initializeApp
}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,

createUserWithEmailAndPassword,

signInWithEmailAndPassword,

signOut,

onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getFirestore,

collection,

doc,

setDoc,

getDoc,

getDocs,

addDoc,

query,

where,

onSnapshot,

orderBy,

serverTimestamp,

updateDoc,

arrayUnion

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",

authDomain:
"cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",

projectId:
"cyber-nyza-by-mrjingan-9d4c3",

storageBucket:
"cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",

messagingSenderId:
"246846891948",

appId:
"1:246846891948:web:ded9f6edb7ba6852ce3c09"

};


/* INITIALIZE */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* VARIABLES */

let currentUser = null;

let activeChatId = null;

let activeChatName = null;

let unsubscribeMessages = null;

let unsubscribeChats = null;



/* SIGN UP */

window.signup = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


if(!email || !password){

alert("Enter email and password");

return;

}


try{

const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);


await setDoc(
doc(db,"users",result.user.uid),
{

email:email,

uid:result.user.uid,

createdAt:
serverTimestamp()

}
);


alert("Account created successfully!");

}

catch(error){

alert(error.message);

}

};



/* LOGIN */

window.login = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

catch(error){

alert(error.message);

}

};



/* LOGOUT */

window.logoutUser = async function(){

await signOut(auth);

};



/* AUTH CHECK */

onAuthStateChanged(
auth,
user=>{

if(user){

currentUser = user;

document.getElementById(
"loginPage"
).style.display="none";


document.getElementById(
"app"
).style.display="block";


document.getElementById(
"currentUser"
).innerText=
user.email.split("@")[0];


document.getElementById(
"currentEmail"
).innerText=
user.email;


loadChats();

}

else{

currentUser = null;

document.getElementById(
"loginPage"
).style.display="flex";


document.getElementById(
"app"
).style.display="none";

}

}
);



/* LOAD CHATS */

function loadChats(){

if(unsubscribeChats){

unsubscribeChats();

}


const q =
query(

collection(db,"chats"),

where(
"members",
"array-contains",
currentUser.uid
)

);


unsubscribeChats =
onSnapshot(
q,
snapshot=>{

const chatList =
document.getElementById("chatList");


chatList.innerHTML="";


snapshot.forEach(
chatDoc=>{

const data =
chatDoc.data();


let name =
data.name || "Personal Chat";


if(
data.type === "personal"
){

const otherUser =
data.memberEmails.find(
email=>email !== currentUser.email
);


name =
otherUser || "Personal Chat";

}


const item =
document.createElement("div");


item.className=
"chatItem";


item.onclick =
()=>openChat(
chatDoc.id,
name
);


item.innerHTML=

`

<div class="avatar">
${name.charAt(0).toUpperCase()}
</div>

<div class="chatName">
${name}
</div>

`;


chatList.appendChild(item);

}

);

}

);

}



/* NEW PERSONAL CHAT */

window.newPersonalChat =
async function(){

const email =
prompt(
"Enter friend's email address:"
);


if(!email){

return;

}


if(
email === currentUser.email
){

alert("You cannot chat with yourself");

return;

}


/* FIND USER */

const q =
query(

collection(db,"users"),

where(
"email",
"==",
email
)

);


const result =
await getDocs(q);


if(result.empty){

alert(
"User not found. Ask them to create a CYBER NYZA account first."
);

return;

}


const otherUser =
result.docs[0].data();


/* CREATE CHAT */

const chatId =
[currentUser.uid,otherUser.uid]
.sort()
.join("_");


const chatRef =
doc(
db,
"chats",
chatId
);


const existing =
await getDoc(chatRef);


if(!existing.exists()){

await setDoc(
chatRef,
{

type:"personal",

members:[
currentUser.uid,
otherUser.uid
],

memberEmails:[
currentUser.email,
otherUser.email
],

createdAt:
serverTimestamp()

}

);

}


openChat(
chatId,
email
);

};



/* CREATE GROUP */

window.newGroup =
async function(){

const name =
prompt("Enter group name:");


if(!name){

return;

}


const groupRef =
await addDoc(
collection(db,"chats"),
{

type:"group",

name:name,

members:[
currentUser.uid
],

memberEmails:[
currentUser.email
],

createdAt:
serverTimestamp()

}

);


alert(
"Group created! You can now start chatting."
);


openChat(
groupRef.id,
name
);

};



/* OPEN CHAT */

function openChat(
chatId,
name
){

activeChatId =
chatId;

activeChatName =
name;


document.getElementById(
"main"
).classList.add(
"chatOpen"
);


document.getElementById(
"emptyChat"
).style.display=
"none";


document.getElementById(
"chatHeader"
).style.display=
"flex";


document.getElementById(
"messages"
).style.display=
"block";


document.getElementById(
"messageBox"
).style.display=
"flex";


document.getElementById(
"chatTitle"
).innerText=
name;


loadMessages();

}



/* LOAD MESSAGES */

function loadMessages(){

if(unsubscribeMessages){

unsubscribeMessages();

}


const messagesQuery =
query(

collection(
db,
"chats",
activeChatId,
"messages"
),

orderBy(
"createdAt",
"asc"
)

);


unsubscribeMessages =
onSnapshot(
messagesQuery,
snapshot=>{

const messages =
document.getElementById(
"messages"
);


messages.innerHTML="";


snapshot.forEach(
messageDoc=>{

const data =
messageDoc.data();


const div =
document.createElement("div");


div.className =
"message " +
(
data.senderId === currentUser.uid
?
"sent"
:
"received"
);


let senderText =
"";


if(
data.senderId !== currentUser.uid
){

senderText =
`
<div class="sender">
${data.senderEmail || "User"}
</div>
`;

}


div.innerHTML =

senderText +

`

${data.text}

<div class="messageTime">

${
data.createdAt
?
data.createdAt
.toDate()
.toLocaleTimeString()
:
"Sending..."
}

</div>

`;


messages.appendChild(
div
);

}
);


messages.scrollTop =
messages.scrollHeight;

}

);

}



/* SEND MESSAGE */

window.sendMessage =
async function(){

const input =
document.getElementById(
"messageInput"
);


const text =
input.value.trim();


if(
!text ||
!activeChatId
){

return;

}


input.value="";


await addDoc(

collection(
db,
"chats",
activeChatId,
"messages"
),

{

text:text,

senderId:
currentUser.uid,

senderEmail:
currentUser.email,

createdAt:
serverTimestamp()

}

);

};



/* ENTER KEY */

window.checkEnter =
function(event){

if(
event.key === "Enter"
){

sendMessage();

}

};

</script>

</body>
</html>
