<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CYBER NYZA CHAT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080b12;
  color:white;
  min-height:100vh;
}

#authScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#080b12,#151d35);
}

.authBox{
  width:100%;
  max-width:400px;
  background:#111827;
  padding:30px 20px;
  border-radius:25px;
  border:1px solid #263142;
}

.authBox h1{
  text-align:center;
  margin-bottom:10px;
  color:#ffffff;
}

.authBox p{
  text-align:center;
  color:#aab4c4;
  margin-bottom:25px;
}

.authBox input{
  width:100%;
  margin-bottom:12px;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#202b3c;
  color:white;
  font-size:16px;
  outline:none;
}

.authBox button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#4f63d8;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.switchText{
  margin-top:18px !important;
  font-size:14px;
}

.switchText span{
  color:#7185ff;
  font-weight:bold;
  cursor:pointer;
}

#app{
  display:none;
  width:100%;
  max-width:700px;
  min-height:100vh;
  margin:auto;
  background:#111827;
}

header{
  background:linear-gradient(135deg,#3f51b5,#243b8f);
  padding:22px 15px;
  text-align:center;
}

header h1{
  font-size:24px;
  letter-spacing:1px;
}

.userBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 15px;
  border-bottom:1px solid #263142;
  background:#151d29;
}

#username{
  color:#c7d2fe;
  font-weight:bold;
}

.logoutBtn{
  border:0;
  background:#d64545;
  color:white;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
}

#status{
  padding:10px;
  text-align:center;
  color:#b9c2d0;
  font-size:14px;
  border-bottom:1px solid #263142;
}

#messages{
  height:calc(100vh - 220px);
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  background:#1f2937;
  padding:12px 14px;
  border-radius:15px;
  max-width:85%;
  align-self:flex-start;
  word-break:break-word;
}

.msg.own{
  align-self:flex-end;
  background:#3f51b5;
}

.msgName{
  font-size:12px;
  font-weight:bold;
  color:#aab8ff;
  margin-bottom:5px;
}

.msg.own .msgName{
  color:#dbe2ff;
}

.time{
  display:block;
  color:#b6c0d0;
  font-size:10px;
  margin-top:6px;
}

.empty{
  color:#8491a3;
  text-align:center;
  margin-top:40px;
}

.bar{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:700px;
  padding:12px;
  background:#111827;
  border-top:1px solid #263142;
  display:flex;
  gap:8px;
}

.bar input{
  flex:1;
  border:0;
  border-radius:24px;
  padding:14px;
  background:#202b3c;
  color:white;
  outline:none;
  font-size:16px;
}

.bar button{
  border:0;
  border-radius:24px;
  padding:0 20px;
  background:#4f63d8;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.bar button:disabled{
  opacity:.5;
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->
<div id="authScreen">

  <div class="authBox">

    <h1 id="authTitle">CYBER NYZA</h1>

    <p id="authSubtitle">Login to enter the chat</p>

    <input
      type="text"
      id="nameInput"
      placeholder="Your username"
    >

    <input
      type="email"
      id="emailInput"
      placeholder="Email address"
    >

    <input
      type="password"
      id="passwordInput"
      placeholder="Password"
    >

    <button id="authButton">Register</button>

    <p class="switchText">
      <span id="switchAuth">Already have an account? Login</span>
    </p>

  </div>

</div>


<!-- CHAT APP -->
<main id="app">

  <header>
    <h1>CYBER NYZA CHAT</h1>
  </header>

  <div class="userBar">

    <span>
      👤 <span id="username">User</span>
    </span>

    <button class="logoutBtn" id="logoutBtn">
      Logout
    </button>

  </div>

  <div id="status">
    Connecting to Firebase...
  </div>

  <div id="messages">
    <div class="empty">
      Loading messages...
    </div>
  </div>

  <form class="bar" id="form">

    <input
      id="message"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button id="send" type="submit">
      Send
    </button>

  </form>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyDG6dW07j-tfClCQ1o2B5GgyqBED1ZUx8s",

  authDomain:
  "cyber-nyza-by-mrjingan-9d4c3.firebaseapp.com",

  projectId:
  "cyber-nyza-by-mrjingan-9d4c3",

  storageBucket:
  "cyber-nyza-by-mrjingan-9d4c3.firebasestorage.app",

  messagingSenderId:
  "246846891948",

  appId:
  "1:246846891948:web:7054c940ea7b9eefce3c09"

};


const firebaseApp = initializeApp(firebaseConfig);

const db = getFirestore(firebaseApp);

const auth = getAuth(firebaseApp);

const messagesRef =
collection(db, "messages");


const authScreen =
document.getElementById("authScreen");

const appScreen =
document.getElementById("app");

const authTitle =
document.getElementById("authTitle");

const authSubtitle =
document.getElementById("authSubtitle");

const nameInput =
document.getElementById("nameInput");

const emailInput =
document.getElementById("emailInput");

const passwordInput =
document.getElementById("passwordInput");

const authButton =
document.getElementById("authButton");

const switchAuth =
document.getElementById("switchAuth");

const username =
document.getElementById("username");

const logoutBtn =
document.getElementById("logoutBtn");

const status =
document.getElementById("status");

const messages =
document.getElementById("messages");

const form =
document.getElementById("form");

const input =
document.getElementById("message");

const send =
document.getElementById("send");


let loginMode = false;


switchAuth.addEventListener("click", () => {

  loginMode = !loginMode;

  if(loginMode){

    authTitle.textContent =
    "WELCOME BACK";

    authSubtitle.textContent =
    "Login to continue";

    nameInput.style.display =
    "none";

    authButton.textContent =
    "Login";

    switchAuth.textContent =
    "New user? Create account";

  }

  else{

    authTitle.textContent =
    "CYBER NYZA";

    authSubtitle.textContent =
    "Create your account";

    nameInput.style.display =
    "block";

    authButton.textContent =
    "Register";

    switchAuth.textContent =
    "Already have an account? Login";

  }

});


authButton.addEventListener(
"click",
async () => {

  const name =
  nameInput.value.trim();

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;


  if(!email || !password){

    alert(
    "Enter email and password"
    );

    return;

  }


  authButton.disabled =
  true;


  try{

    if(loginMode){

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

    else{

      if(!name){

        alert(
        "Enter your username"
        );

        authButton.disabled =
        false;

        return;

      }


      const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


      await updateProfile(
        userCredential.user,
        {
          displayName:name
        }
      );

    }


    passwordInput.value =
    "";


  }

  catch(error){

    console.error(error);

    alert(
      "Error: " +
      error.message
    );

  }

  finally{

    authButton.disabled =
    false;

  }

});


logoutBtn.addEventListener(
"click",
async () => {

  await signOut(auth);

});


onAuthStateChanged(
auth,
(user) => {

  if(user){

    authScreen.style.display =
    "none";

    appScreen.style.display =
    "block";


    username.textContent =
    user.displayName ||
    user.email;

    startChat(user);

  }

  else{

    authScreen.style.display =
    "flex";

    appScreen.style.display =
    "none";

  }

});


function startChat(user){

  const q =
  query(
    messagesRef,
    orderBy(
      "createdAt",
      "asc"
    )
  );


  onSnapshot(
  q,
  (snapshot) => {

    messages.innerHTML =
    "";


    if(snapshot.empty){

      messages.innerHTML =
      '<div class="empty">No messages yet. Send the first message! 👋</div>';

    }

    else{

      snapshot.forEach(
      (doc) => {

        const data =
        doc.data();


        const div =
        document.createElement("div");


        div.className =
        "msg";


        if(
          data.uid ===
          user.uid
        ){

          div.classList.add(
          "own"
          );

        }


        const name =
        document.createElement("div");

        name.className =
        "msgName";

        name.textContent =
        data.name ||
        "User";


        const text =
        document.createElement("div");

        text.textContent =
        data.text ||
        "";


        div.appendChild(name);

        div.appendChild(text);


        if(data.createdAt){

          const time =
          document.createElement("span");

          time.className =
          "time";

          time.textContent =
          data.createdAt
          .toDate()
          .toLocaleString();


          div.appendChild(time);

        }


        messages.appendChild(div);

      });


      messages.scrollTop =
      messages.scrollHeight;

    }


    status.textContent =
    "🟢 Connected";

  },

  (error) => {

    console.error(error);

    status.textContent =
    "🔴 Firebase error: " +
    error.code;

  });

}


form.addEventListener(
"submit",
async (e) => {

  e.preventDefault();


  const text =
  input.value.trim();


  if(!text) return;


  const user =
  auth.currentUser;


  if(!user){

    alert(
    "Please login first"
    );

    return;

  }


  send.disabled =
  true;


  try{

    await addDoc(
    messagesRef,
    {

      text:text,

      name:
      user.displayName ||
      user.email,

      uid:
      user.uid,

      createdAt:
      serverTimestamp()

    });


    input.value =
    "";


  }

  catch(error){

    console.error(error);

    alert(
      "Message send error: " +
      error.code
    );

  }

  finally{

    send.disabled =
    false;

  }

});

</script>

</body>
</html>
